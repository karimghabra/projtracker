name: installer

# Builds the Windows installers for the desktop shell.
#
# Push a tag to cut a release:   git tag v0.1.0 && git push origin v0.1.0
# Or run it by hand from the Actions tab to get the installers as artefacts
# without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The frontend is plain HTML with no bundler, so there is no npm step:
      # tauri.conf.json points frontendDist straight at app/dist.
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: cargo tauri
          # only publish a release when a tag triggered the run
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseBody: |
            Windows installers for the protracker dashboard.

            The app is a thin shell: it runs `python -m protracker.cli --json`
            and renders the result. It therefore needs Python and a checkout of
            this repository on the same machine. Point Settings at that folder
            on first launch.
          releaseDraft: true

      - name: Upload installers as artefacts
        uses: actions/upload-artifact@v4
        with:
          name: protracker-windows-installers
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
