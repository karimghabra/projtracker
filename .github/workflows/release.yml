name: Release

# Builds installers for all three platforms and attaches them to a GitHub
# release. Triggered by a version tag, or by hand from the Actions tab when you
# just want a fresh build to download.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish as (e.g. v1.2.0). Blank names it after the run.'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    strategy:
      # One platform failing should not deny you the others.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows installer
            target: --win
            artifact: Protracker-Windows
            pattern: 'release/*.exe'
          - os: macos-latest
            label: macOS disk image
            target: --mac
            artifact: Protracker-macOS
            pattern: 'release/*.dmg'
          - os: ubuntu-latest
            label: Linux AppImage and deb
            target: --linux
            artifact: Protracker-Linux
            pattern: |
              release/*.AppImage
              release/*.deb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Nothing ships that has not passed. A broken installer is worse than no
      # installer, because it looks like it worked.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build the UI
        run: npm run build:ui

      - name: Build the shell and the CLI
        run: npm run build:electron

      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A build can succeed and still ship a blank window. Launch the real
      # executable and make sure it is alive and quiet before publishing.
      # Only on Windows: the other two need a display server to start.
      - name: Verify the packaged app starts
        if: matrix.os == 'windows-latest'
        run: node scripts/verify-package.mjs release/win-unpacked/Protracker.exe 12

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result != 'cancelled'

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Name the tag
        id: name
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: List what is going out
        shell: bash
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.name.outputs.tag }}
          name: Protracker ${{ steps.name.outputs.tag }}
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            Download the one for your machine and run it.

            | Platform | File |
            |---|---|
            | Windows | `Protracker-Setup-*.exe` |
            | macOS | `Protracker-*.dmg` |
            | Linux | `Protracker-*.AppImage` or `.deb` |

            No Python, no Rust, no compilers. Windows and macOS install
            per-user, so no administrator is needed.

            The builds are unsigned, so Windows SmartScreen will warn on first
            run (More info → Run anyway) and macOS will need
            right-click → Open the first time.

            Your data lives in plain text files. Settings shows you where.
