name: installer

# Builds the Windows installers for the desktop shell.
#
# Push a tag to cut a release:   git tag v0.1.0 && git push origin v0.1.0
# Or run it by hand from the Actions tab to get the installers as artefacts
# without publishing a release.
#
# There is no npm step: the frontend is plain HTML and tauri.conf.json points
# frontendDist straight at app/dist. That also means tauri-action cannot
# install the Tauri CLI for us the way it would in a Node project, so we
# install cargo-tauri explicitly below.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # prebuilt binary, so this takes seconds rather than compiling the CLI
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall -y --force "tauri-cli@^2.0"

      - name: Build installers
        working-directory: app
        run: cargo tauri build

      - name: Upload installers as artefacts
        uses: actions/upload-artifact@v4
        with:
          name: protracker-windows-installers
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish a draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes "Windows installers for the protracker dashboard.

          The app is a thin shell: it runs \`python -m protracker.cli --json\`
          and renders the result. It therefore needs Python and a checkout of
          this repository on the same machine. Point Settings at that folder on
          first launch." \
            app/src-tauri/target/release/bundle/nsis/*.exe \
            app/src-tauri/target/release/bundle/msi/*.msi
