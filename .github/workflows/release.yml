name: installer

# Builds the Windows installers for the desktop shell.
#
# Push a tag to cut a release:   git tag v0.1.0 && git push origin v0.1.0
# Or run it by hand from the Actions tab to get the installers as artefacts
# without publishing a release.
#
# The frontend is a React + Vite app in app/ui that builds into app/dist,
# which tauri.conf.json serves as frontendDist — so npm build runs below,
# before cargo tauri build. tauri-action is not used, so cargo-tauri is
# installed explicitly.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Build the dashboard
        shell: bash
        run: |
          npm ci --prefix app/ui
          npm run build --prefix app/ui
          test -f app/dist/index.html

      # The sidecar is what makes an installed copy self-contained: without it
      # the app needs Python and a checkout on the target machine, which is no
      # use to someone who just downloaded an installer.
      - name: Build the CLI sidecar
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller openpyxl
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          echo "building sidecar for $TRIPLE"
          python -m PyInstaller --onefile \
            --name "protracker-cli-${TRIPLE}" \
            --distpath app/src-tauri/binaries \
            --hidden-import openpyxl \
            --add-data "protracker/graph_template.html;protracker" \
            --paths . --noconfirm app/cli_entry.py
          ls -l app/src-tauri/binaries
          test -f "app/src-tauri/binaries/protracker-cli-${TRIPLE}.exe"

      # The sidecar must work *as bundled* -- data files the source tree takes
      # for granted (the graph template) only exist inside the onefile archive
      # if the step above packed them. Exercise every verb the app calls,
      # including graph, against a scratch database before promising it in an
      # installer.
      - name: Smoke-test the sidecar
        shell: bash
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          CLI="app/src-tauri/binaries/protracker-cli-${TRIPLE}.exe"
          DB=$(mktemp -u).db
          "$CLI" --db "$DB" --json add project "Smoke" > /dev/null
          "$CLI" --db "$DB" --json ready --impact > /dev/null
          "$CLI" --db "$DB" --json progress > /dev/null
          "$CLI" --db "$DB" --json graph "$RUNNER_TEMP/smoke_graph.html" > /dev/null
          test -s "$RUNNER_TEMP/smoke_graph.html"
          echo "sidecar smoke test passed"

      # prebuilt binary, so this takes seconds rather than compiling the CLI
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall -y --force "tauri-cli@^2.0"

      # The cargo cache restores target/, which still holds the *previous*
      # release's bundle. Without this the collect step globs stale installers
      # and publishes them beside the new ones -- an old, broken build sitting
      # on the release page looking just as downloadable as the current one.
      - name: Clear stale bundles
        shell: bash
        run: rm -rf app/src-tauri/target/release/bundle

      - name: Build installers
        working-directory: app
        run: cargo tauri build

      - name: Upload installers as artefacts
        uses: actions/upload-artifact@v4
        with:
          name: protracker-windows-installers
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Sanity-check the bundle before we promise it in a release. Globbing
      # into `gh release create` silently uploads nothing if a path is wrong,
      # which would publish an empty release.
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          cp app/src-tauri/target/release/bundle/nsis/*.exe out/
          cp app/src-tauri/target/release/bundle/msi/*.msi out/
          ls -l out
          test "$(ls out/*.exe | wc -l)" -ge 1 || { echo "no .exe produced"; exit 1; }
          # exactly one build may be published, and it must be this tag's
          test "$(ls out/*.exe | wc -l)" -eq 1 || { echo "stale bundles present"; exit 1; }
          if [ -n "${GITHUB_REF_NAME:-}" ] && [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            ls out/*.exe | grep -q "${GITHUB_REF_NAME#v}" \
              || { echo "installer does not carry version ${GITHUB_REF_NAME#v}"; exit 1; }
          fi

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cat > notes.md <<'EOF'
          Windows installer for the protracker dashboard.

          Grab `protracker_*_x64-setup.exe` below and run it. The `.msi` is the
          same app for anyone who prefers MSI deployment.

          **Self-contained**: the CLI is bundled as a sidecar, so the machine
          needs neither Python nor a checkout. On first launch the setup
          screen walks you through picking a database and importing a
          workbook (or starting empty).
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            out/*.exe out/*.msi
