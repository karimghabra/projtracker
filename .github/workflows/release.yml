name: installer

# Builds the Windows installers for the desktop shell.
#
# Push a tag to cut a release:   git tag v0.1.0 && git push origin v0.1.0
# Or run it by hand from the Actions tab to get the installers as artefacts
# without publishing a release.
#
# There is no npm step: the frontend is plain HTML and tauri.conf.json points
# frontendDist straight at app/dist. That also means tauri-action cannot
# install the Tauri CLI for us the way it would in a Node project, so we
# install cargo-tauri explicitly below.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The sidecar is what makes an installed copy self-contained: without it
      # the app needs Python and a checkout on the target machine, which is no
      # use to someone who just downloaded an installer.
      - name: Build the CLI sidecar
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller openpyxl
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          echo "building sidecar for $TRIPLE"
          python -m PyInstaller --onefile \
            --name "protracker-cli-${TRIPLE}" \
            --distpath app/src-tauri/binaries \
            --hidden-import openpyxl \
            --paths . --noconfirm app/cli_entry.py
          ls -l app/src-tauri/binaries
          test -f "app/src-tauri/binaries/protracker-cli-${TRIPLE}.exe"

      # prebuilt binary, so this takes seconds rather than compiling the CLI
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall -y --force "tauri-cli@^2.0"

      - name: Build installers
        working-directory: app
        run: cargo tauri build

      - name: Upload installers as artefacts
        uses: actions/upload-artifact@v4
        with:
          name: protracker-windows-installers
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Sanity-check the bundle before we promise it in a release. Globbing
      # into `gh release create` silently uploads nothing if a path is wrong,
      # which would publish an empty release.
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          cp app/src-tauri/target/release/bundle/nsis/*.exe out/
          cp app/src-tauri/target/release/bundle/msi/*.msi out/
          ls -l out
          test "$(ls out/*.exe | wc -l)" -ge 1 || { echo "no .exe produced"; exit 1; }

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cat > notes.md <<'EOF'
          Windows installer for the protracker dashboard.

          Grab `protracker_*_x64-setup.exe` below and run it. The `.msi` is the
          same app for anyone who prefers MSI deployment.

          **This installs the shell only.** The app runs
          `python -m protracker.cli --json` and renders the result, so the
          machine also needs Python and a clone of this repository:

          ```
          git clone https://github.com/karimghabra/projtracker.git
          cd projtracker
          pip install -e . && pip install openpyxl
          ```

          On first launch open **Settings** and point it at that clone and a
          database file, then use **Import…** to ingest a workbook.
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            out/*.exe out/*.msi
