name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit tests, end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build the UI
        run: npm run build:ui

      - name: Build the CLI and shell
        run: npm run build:electron

      - name: Install the browser Playwright drives
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  smoke-cli:
    name: The CLI works against a real directory
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:electron

      # A vault is a directory of text files, so this is the whole contract:
      # write through the CLI, read the files back, and check they say what
      # they should.
      - name: Drive it
        shell: bash
        run: |
          set -euo pipefail
          export PROTRACKER_VAULT="$RUNNER_TEMP/vault"
          pt() { node dist/cli/bin.js "$@"; }
          project="$PROTRACKER_VAULT/projects/smoke-test.pt"

          pt add project "Smoke test"
          pt add smoke-test "Milestone" --seq 1
          pt add smoke-test.milestone "Goal" --seq 1
          pt add smoke-test.milestone.goal "First" --seq 1
          pt add smoke-test.milestone.goal "Second" --seq 2

          # Only the first task is actionable; the second waits on its rank.
          test "$(pt ready --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).length))')" = "1"

          pt done First
          pt ready --json | grep -q Second
          grep -q 'status: done' "$project"

          # Undo reverts the whole image, on disk as well as in memory.
          pt undo
          ! grep -q 'status: done' "$project"

          # Starting a protocol run writes its steps into the planner file.
          pt scaffold type "Collagen sponge"
          batch=$(pt scaffold add collagen-sponge 24 --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).id))')
          pt crosslink edc-nhs "$batch"
          grep -q 'sourceKind: protocol' "$PROTRACKER_VAULT/planner.pt"
          pt runs | grep -q 'EDC/NHS'

          pt where
