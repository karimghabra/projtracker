name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest openpyxl
          python -m pip install -e .

      - name: Run the suite
        run: python -m pytest -q

  # The dashboard is logic-free by design, but "renders what the command layer
  # returns" is a claim worth enforcing. These build the real frontend and
  # drive it in Chromium with its bridge wired to the real CLI. Note the
  # pytest job above runs with no Node at all — deleting app/ must leave the
  # system fully functional, and that job is the proof.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Build the dashboard
        run: |
          npm ci --prefix app/ui
          npm run build --prefix app/ui

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest openpyxl playwright
          python -m pip install -e .
          python -m playwright install --with-deps chromium

      - name: Run the dashboard tests
        run: python -m pytest tests/e2e -q
