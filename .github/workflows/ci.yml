name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit tests, end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build the CLI and shell
        run: npm run build:electron

      - name: Install the browser Playwright drives
        run: npx playwright install --with-deps chromium

      # The web server in playwright.config.ts builds the UI and serves the
      # built bundle, so this exercises what the installer actually ships.
      - name: End-to-end tests
        run: npx playwright test

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  smoke-cli:
    name: The CLI works against a real directory
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:electron

      # A vault is a directory of text files, so this is the whole contract:
      # write through the CLI, read the files back, and check they say what
      # they should.
      # Split into named steps: when this fails, the API says which one, which
      # is the difference between a two-minute diagnosis and a guessing game.
      #
      # Note the absence of `cmd | grep -q` anywhere below. Under `pipefail`,
      # grep -q exits on the first match, the writer takes SIGPIPE, and the
      # pipeline reports failure for a command that did exactly what was asked.
      # Output is captured into a variable first, every time.
      - name: Build a board
        shell: bash
        run: |
          set -euxo pipefail
          export PROTRACKER_VAULT="$RUNNER_TEMP/vault"
          node dist/cli/bin.js add project "Smoke test"
          node dist/cli/bin.js add smoke-test "Milestone" --seq 1
          node dist/cli/bin.js add smoke-test.milestone "Goal" --seq 1
          node dist/cli/bin.js add smoke-test.milestone.goal "First" --seq 1
          node dist/cli/bin.js add smoke-test.milestone.goal "Second" --seq 2

      - name: Sequence numbers gate the second task
        shell: bash
        run: |
          set -euxo pipefail
          export PROTRACKER_VAULT="$RUNNER_TEMP/vault"
          ready=$(node dist/cli/bin.js ready --json)
          count=$(printf '%s' "$ready" | node -p 'JSON.parse(require("node:fs").readFileSync(0,"utf8")).length')
          test "$count" = "1"

      - name: Completing one frees the next, and reaches the disk
        shell: bash
        run: |
          set -euxo pipefail
          export PROTRACKER_VAULT="$RUNNER_TEMP/vault"
          node dist/cli/bin.js done First
          ready=$(node dist/cli/bin.js ready --json)
          case "$ready" in *Second*) ;; *) echo "Second did not become ready"; exit 1 ;; esac
          grep -q 'status: done' "$PROTRACKER_VAULT/projects/smoke-test.pt"

      - name: Undo reverts the whole image, on disk too
        shell: bash
        run: |
          set -euxo pipefail
          export PROTRACKER_VAULT="$RUNNER_TEMP/vault"
          node dist/cli/bin.js undo
          if grep -q 'status: done' "$PROTRACKER_VAULT/projects/smoke-test.pt"; then
            echo "undo did not reach the file"; exit 1
          fi

      - name: A protocol run writes its steps into the planner
        shell: bash
        run: |
          set -euxo pipefail
          export PROTRACKER_VAULT="$RUNNER_TEMP/vault"
          node dist/cli/bin.js scaffold type "Collagen sponge"
          added=$(node dist/cli/bin.js scaffold add collagen-sponge 24 --json)
          batch=$(printf '%s' "$added" | node -p 'JSON.parse(require("node:fs").readFileSync(0,"utf8")).id')
          node dist/cli/bin.js crosslink edc-nhs "$batch"
          grep -q 'sourceKind: protocol' "$PROTRACKER_VAULT/planner.pt"
          runs=$(node dist/cli/bin.js runs)
          case "$runs" in *EDC/NHS*) ;; *) echo "the run is not listed"; exit 1 ;; esac
          node dist/cli/bin.js where

      # Exercises the bundled exceljs. It is CommonJS inside an ESM bundle, so
      # it needs a createRequire shim — and without one this fails only here,
      # at runtime, on the one command nothing else touches.
      - name: Workbooks go out and come back
        shell: bash
        run: |
          set -euxo pipefail
          export PROTRACKER_VAULT="$RUNNER_TEMP/vault"
          node dist/cli/bin.js export "$RUNNER_TEMP/board.xlsx"
          test -s "$RUNNER_TEMP/board.xlsx"
          preview=$(node dist/cli/bin.js import "$RUNNER_TEMP/board.xlsx" --preview)
          case "$preview" in *"Smoke test"*) ;; *) echo "the export did not read back"; exit 1 ;; esac
