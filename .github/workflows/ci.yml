name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest openpyxl
          python -m pip install -e .

      - name: Run the suite
        run: python -m pytest -q

  # The dashboard is logic-free by design, but "renders what the command layer
  # returns" is a claim worth enforcing. These drive the real frontend in
  # Chromium with its bridge wired to the real CLI.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest openpyxl playwright
          python -m pip install -e .
          python -m playwright install --with-deps chromium

      - name: Run the dashboard tests
        run: python -m pytest tests/e2e -q
