<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>protracker</title>
<style>
  :root {
    --bg: #16181d; --panel: #1e2128; --line: #2c313b; --ink: #e6e8ec;
    --dim: #949aa6; --accent: #6ea8fe;
    --on-track: #70ad47; --not-begun: #ffc000;
    --off-track: #5b9bd5; --wont-finish: #e05a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .spacer { flex: 1; }
  button {
    background: #2b303a; color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #343a46; }
  button.primary { background: var(--accent); color: #10131a; border-color: transparent; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button.tiny { padding: 3px 9px; font-size: 12px; }
  input, select, textarea {
    background: #14161b; color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 9px; font: inherit; width: 100%;
  }
  main { display: grid; grid-template-columns: 420px 1fr; gap: 16px; padding: 16px; align-items: start; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  section > h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--dim); margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
  }
  section > h2 .spacer { flex: 1; }
  .rows { max-height: calc(100vh - 160px); overflow-y: auto; }
  .row { padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row.clickable { cursor: pointer; }
  .row.clickable:hover { background: #232833; }
  .row.selected { background: #232a38; box-shadow: inset 3px 0 0 var(--accent); }
  .title { display: flex; align-items: baseline; gap: 8px; }
  .title .name { font-weight: 500; }
  .meta { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .pill {
    font-size: 11px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); white-space: nowrap;
  }
  .pill.empty { color: var(--accent); border-color: #2f4468; }
  .pill.stale { color: #e0a45a; border-color: #5a4326; }
  .pill.active { color: var(--on-track); border-color: #35502a; }
  .pill.complete { color: var(--dim); }
  .bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 8px; background: #14161b; }
  .bar > span { display: block; }
  .impact { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; }
  .impact b { color: var(--ink); font-weight: 600; }
  .health-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .empty { padding: 24px 14px; color: var(--dim); text-align: center; }
  dialog {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 12px; padding: 0; width: 460px; max-width: 92vw;
  }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h3 { margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
  dialog .body { padding: 16px; display: grid; gap: 12px; }
  dialog .actions { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
  label { display: grid; gap: 5px; font-size: 12px; color: var(--dim); }
  #toast {
    position: fixed; right: 16px; bottom: 16px; max-width: 460px; display: grid; gap: 8px; z-index: 20;
  }
  .toast {
    background: #232833; border: 1px solid var(--line); border-left: 3px solid var(--accent);
    padding: 10px 13px; border-radius: 8px; font-size: 13px; white-space: pre-wrap;
  }
  .toast.err { border-left-color: var(--wont-finish); }
  code { background: #14161b; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>protracker</h1>
  <span class="pill" id="dbLabel">—</span>
  <span class="spacer"></span>
  <button id="btnImport">Import…</button>
  <button id="btnAdd">Add…</button>
  <button id="btnSettings">Settings</button>
  <button id="btnRefresh" class="primary">Refresh</button>
</header>

<main>
  <section>
    <h2>Projects <span class="spacer"></span><span class="pill" id="projCount"></span></h2>
    <div class="rows" id="projects"><div class="empty">Loading…</div></div>
  </section>

  <section>
    <h2>
      Ready now <span class="spacer"></span>
      <span class="pill" id="readyScope">all projects</span>
      <span class="pill" id="readyCount"></span>
    </h2>
    <div class="rows" id="ready"><div class="empty">Loading…</div></div>
  </section>
</main>

<dialog id="addDlg">
  <h3>Add a node</h3>
  <div class="body">
    <label>Kind
      <select id="addKind">
        <option value="project">Project</option>
        <option value="milestone">Milestone</option>
        <option value="goal">Goal</option>
        <option value="task">Task</option>
      </select>
    </label>
    <label>Name <input id="addName" placeholder="e.g. Bridge Retrofit"></label>
    <label id="addParentWrap">Parent <select id="addParent"></select></label>
    <label>Notes (optional) <textarea id="addNotes" rows="2"></textarea></label>
  </div>
  <div class="actions">
    <button id="addCancel">Cancel</button>
    <button id="addOk" class="primary">Create</button>
  </div>
</dialog>

<dialog id="impDlg">
  <h3>Import a tracker workbook</h3>
  <div class="body">
    <label>Workbook
      <input id="impPath" placeholder="Project Tracker Q3 2026.xlsx">
    </label>
    <div class="meta">
      A relative name is resolved inside the project directory. Re-importing
      the same file is safe: rows are matched, not duplicated.
    </div>
  </div>
  <div class="actions">
    <button id="impCancel">Cancel</button>
    <button id="impOk" class="primary">Import</button>
  </div>
</dialog>

<dialog id="setDlg">
  <h3>Settings</h3>
  <div class="body">
    <label>Project directory <input id="setDir"></label>
    <label>Database file <input id="setDb"></label>
    <label>Stale after (days) <input id="setDays" type="number" min="1"></label>
  </div>
  <div class="actions">
    <button id="setCancel">Cancel</button>
    <button id="setOk" class="primary">Save</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
// ---------------------------------------------------------------------------
// This file renders whatever the command layer returns. It computes nothing
// about readiness, impact, or health -- those all arrive already decided from
// `pt`. Keeping it that way is what makes the dashboard deletable.
// ---------------------------------------------------------------------------
const invoke = window.__TAURI__.core.invoke;

const cfg = {
  dir: localStorage.getItem("dir") || "",
  db: localStorage.getItem("db") || "tracker.db",
  days: Number(localStorage.getItem("days") || 30),
};

let state = { projects: [], ready: [], nodes: [], selected: null };

const HEALTH_COLOR = {
  on_track: "var(--on-track)", not_begun: "var(--not-begun)",
  off_track: "var(--off-track)", wont_finish: "var(--wont-finish)",
};
const HEALTH_LABEL = {
  on_track: "on track", not_begun: "not begun",
  off_track: "off track", wont_finish: "won't finish",
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function toast(msg, isError) {
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " err" : "");
  el.textContent = msg;
  $("toast").appendChild(el);
  setTimeout(() => el.remove(), isError ? 9000 : 5000);
}

/** The single door to the application. Nothing else touches data. */
async function pt(...args) {
  try {
    return await invoke("pt", { projectDir: cfg.dir, db: cfg.db, args });
  } catch (e) {
    const msg = typeof e === "string" ? e : JSON.stringify(e);
    toast(msg, true);
    throw e;
  }
}

// --- rendering -------------------------------------------------------------

function healthBar(health, total) {
  if (!total) return "";
  const parts = Object.entries(health || {})
    .sort((a, b) => b[1] - a[1])
    .map(([k, v]) =>
      `<span style="width:${(v / total) * 100}%;background:${HEALTH_COLOR[k] || "#555"}"
             title="${esc(HEALTH_LABEL[k] || k)}: ${v}"></span>`);
  return `<div class="bar">${parts.join("")}</div>`;
}

function renderProjects() {
  const box = $("projects");
  $("projCount").textContent = `${state.projects.length}`;
  if (!state.projects.length) {
    box.innerHTML = `<div class="empty">No projects yet. Use <b>Add…</b>.</div>`;
    return;
  }
  box.innerHTML = state.projects.map((p) => {
    const name = p.project_name || "(planner tasks)";
    const since = p.days_since_last_completion;
    const when = since === null ? "never completed here" : `last done ${since}d ago`;
    const sel = state.selected === p.project_id ? " selected" : "";
    return `
      <div class="row clickable${sel}" data-pid="${p.project_id ?? ""}">
        <div class="title">
          <span class="name">${esc(name)}</span>
          <span class="spacer"></span>
          <span class="pill ${p.state}">${p.state}</span>
        </div>
        <div class="meta">
          ${p.tasks_done}/${p.tasks_total} done · ${p.ready_count} ready · ${esc(when)}
        </div>
        ${healthBar(p.health, p.tasks_open)}
      </div>`;
  }).join("");

  box.querySelectorAll(".row").forEach((row) => {
    row.onclick = () => {
      const raw = row.dataset.pid;
      const pid = raw === "" ? null : Number(raw);
      state.selected = state.selected === pid ? null : pid;
      renderProjects();
      renderReady();
    };
  });
}

function renderReady() {
  const box = $("ready");
  const shown = state.selected === null
    ? state.ready
    : state.ready.filter((t) => t.project_id === state.selected);

  const scope = state.selected === null
    ? "all projects"
    : (state.projects.find((p) => p.project_id === state.selected)?.project_name
       || "planner");
  $("readyScope").textContent = scope;
  $("readyCount").textContent = `${shown.length}`;

  if (!shown.length) {
    box.innerHTML = `<div class="empty">Nothing ready here.</div>`;
    return;
  }
  box.innerHTML = shown.map((t) => `
    <div class="row">
      <div class="title">
        <span class="health-dot" style="background:${HEALTH_COLOR[t.health] || "#555"}"
              title="${esc(HEALTH_LABEL[t.health] || "unset")}"></span>
        <span class="name">${esc(t.name)}</span>
        <span class="spacer"></span>
        <button class="tiny" data-done="${t.id}">Done</button>
      </div>
      <div class="meta">
        <span class="impact">unlocks <b>${t.unlocks_now}</b> · gates <b>${t.gates_total}</b></span>
        · #${t.id} · ${esc(t.project_name || "planner")}
        ${t.deadline ? " · due " + esc(t.deadline) : ""}
      </div>
    </div>`).join("");

  box.querySelectorAll("[data-done]").forEach((btn) => {
    btn.onclick = async () => {
      btn.disabled = true;
      const res = await pt("done", btn.dataset.done);
      const unlocked = res.newly_ready || [];
      let msg = `Completed “${res.completed.name}”.`;
      if (unlocked.length) {
        msg += "\nNow ready: " + unlocked.map((n) => n.name).join(", ");
      }
      for (const key of ["completed_goals", "completed_milestones", "completed_projects"]) {
        for (const n of res[key] || []) msg += `\nFinished ${n.kind}: ${n.name}`;
      }
      toast(msg);
      await refresh();
    };
  });
}

// --- data ------------------------------------------------------------------

async function refresh() {
  $("dbLabel").textContent = cfg.db;
  if (!cfg.dir) {
    $("projects").innerHTML =
      `<div class="empty">Set the project directory in <b>Settings</b>.</div>`;
    $("ready").innerHTML = `<div class="empty">—</div>`;
    return;
  }
  const [projects, ready, nodes] = await Promise.all([
    pt("progress", "--days", String(cfg.days)),
    pt("ready", "--impact"),
    pt("ls"),
  ]);
  state.projects = projects;
  state.ready = ready;
  state.nodes = nodes;
  renderProjects();
  renderReady();
}

// --- dialogs ---------------------------------------------------------------

const PARENT_KIND = { milestone: "project", goal: "milestone", task: "goal" };

function refreshParentOptions() {
  const kind = $("addKind").value;
  const wrap = $("addParentWrap");
  const sel = $("addParent");
  if (kind === "project") {
    wrap.style.display = "none";
    return;
  }
  wrap.style.display = "grid";
  const want = PARENT_KIND[kind];
  const options = state.nodes.filter((n) => n.kind === want);
  sel.innerHTML = options.length
    ? options.map((n) => `<option value="${n.id}">${esc(n.name)} (#${n.id})</option>`).join("")
    : `<option value="">— no ${want} exists yet —</option>`;
}

$("btnAdd").onclick = () => { refreshParentOptions(); $("addDlg").showModal(); };
$("addKind").onchange = refreshParentOptions;
$("addCancel").onclick = () => $("addDlg").close();
$("addOk").onclick = async () => {
  const kind = $("addKind").value;
  const name = $("addName").value.trim();
  const parent = $("addParent").value;
  const notes = $("addNotes").value.trim();
  if (!name) return toast("Name is required.", true);
  if (kind !== "project" && !parent) return toast(`Create a ${PARENT_KIND[kind]} first.`, true);

  const args = ["add", kind, name];
  if (kind !== "project") args.push("--parent", parent);
  if (notes) args.push("--desc", notes);

  const res = await pt(...args);
  $("addDlg").close();
  $("addName").value = "";
  $("addNotes").value = "";
  toast(`Created ${res.created.kind} “${res.created.name}” (#${res.created.id}).`);
  await refresh();
};

$("btnImport").onclick = () => {
  $("impPath").value = localStorage.getItem("lastImport") || "";
  $("impDlg").showModal();
};
$("impCancel").onclick = () => $("impDlg").close();
$("impOk").onclick = async () => {
  const path = $("impPath").value.trim();
  if (!path) return toast("Give the workbook's name or full path.", true);
  $("impOk").disabled = true;
  try {
    const r = await pt("import", path);
    localStorage.setItem("lastImport", path);
    $("impDlg").close();
    let msg = `Imported: ${r.created.length} created, ${r.updated.length} updated, `
            + `${r.unchanged} unchanged.`;
    for (const s of r.skipped_sheets || []) msg += `\nSkipped sheet “${s.sheet}”.`;
    if (r.review?.length) msg += `\n${r.review.length} row(s) need review — see below.`;
    if (r.flagged?.length) msg += `\n${r.flagged.length} note(s) flagged as possible dependencies.`;
    toast(msg);
    // surface the review list rather than burying it in a toast
    for (const item of (r.review || []).slice(0, 6)) {
      toast(`review · ${item.sheet} row ${item.row}: ${item.reason}`, true);
    }
    await refresh();
  } finally {
    $("impOk").disabled = false;
  }
};

$("btnSettings").onclick = () => {
  $("setDir").value = cfg.dir;
  $("setDb").value = cfg.db;
  $("setDays").value = cfg.days;
  $("setDlg").showModal();
};
$("setCancel").onclick = () => $("setDlg").close();
$("setOk").onclick = async () => {
  cfg.dir = $("setDir").value.trim();
  cfg.db = $("setDb").value.trim() || "tracker.db";
  cfg.days = Number($("setDays").value) || 30;
  localStorage.setItem("dir", cfg.dir);
  localStorage.setItem("db", cfg.db);
  localStorage.setItem("days", String(cfg.days));
  $("setDlg").close();
  await refresh();
};

$("btnRefresh").onclick = refresh;
refresh();
</script>
</body>
</html>
