<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>protracker</title>
<style>
/* ---------------------------------------------------------------------------
   Health is a STATUS axis (state), not a categorical one, so it uses the
   reserved status palette and never a series hue. Status colour never carries
   meaning alone: every use is paired with a text label or a legend entry.
   Both modes are selected against their own surface, not flipped.
--------------------------------------------------------------------------- */
:root {
  color-scheme: light;
  --page:        #f9f9f7;
  --surface:     #fcfcfb;
  --raised:      #ffffff;
  --ink:         #0b0b0b;
  --ink-2:       #52514e;
  --muted:       #898781;
  --hairline:    rgba(11, 11, 11, .10);
  --grid:        #e1e0d9;
  --accent:      #2a78d6;
  --accent-ink:  #ffffff;
  --wash:        rgba(42, 120, 214, .08);

  /* Status palette — fixed, never themed. 'not begun' is deliberately NOT a
     status hue: it is the absence of a signal and the majority of any healthy
     board, so it takes the neutral. That also keeps warning and serious off
     the same bar, a pair that measures ΔE 13.6 unsimulated — below the 15
     floor, i.e. hard to separate even with full colour vision. */
  --good:        #0ca30c;
  --warning:     #fab219;
  --critical:    #d03b3b;
  --neutral:     #898781;

  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --shadow: 0 1px 2px rgba(11,11,11,.04), 0 4px 16px rgba(11,11,11,.06);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page:     #0d0d0d;
    --surface:  #1a1a19;
    --raised:   #212120;
    --ink:      #ffffff;
    --ink-2:    #c3c2b7;
    --muted:    #898781;
    --hairline: rgba(255, 255, 255, .10);
    --grid:     #2c2c2a;
    --accent:   #3987e5;
    --accent-ink: #0b0b0b;
    --wash:     rgba(57, 135, 229, .14);
    --shadow: 0 1px 2px rgba(0,0,0,.30), 0 4px 16px rgba(0,0,0,.34);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:     #0d0d0d;
  --surface:  #1a1a19;
  --raised:   #212120;
  --ink:      #ffffff;
  --ink-2:    #c3c2b7;
  --muted:    #898781;
  --hairline: rgba(255, 255, 255, .10);
  --grid:     #2c2c2a;
  --accent:   #3987e5;
  --accent-ink: #0b0b0b;
  --wash:     rgba(57, 135, 229, .14);
  --shadow: 0 1px 2px rgba(0,0,0,.30), 0 4px 16px rgba(0,0,0,.34);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* --- header --------------------------------------------------------------- */
header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--hairline);
  position: sticky; top: 0; z-index: 5;
}
.brand { display: flex; align-items: baseline; gap: 9px; }
.brand h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.brand .ver { font-size: 11px; color: var(--muted); }
.spacer { flex: 1; }

button {
  background: var(--raised); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: var(--r-sm);
  padding: 7px 13px; cursor: pointer; font: inherit; font-size: 13px;
  transition: background .12s ease, border-color .12s ease;
}
button:hover { background: var(--wash); border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary {
  background: var(--accent); color: var(--accent-ink);
  border-color: transparent; font-weight: 600;
}
button.primary:hover { filter: brightness(1.07); }
button.tiny { padding: 4px 10px; font-size: 12px; }
button.icon { padding: 7px 9px; line-height: 1; }

.chip {
  font-size: 12px; padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--hairline); color: var(--ink-2);
  background: var(--page); white-space: nowrap;
}

input, select, textarea {
  background: var(--page); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: var(--r-sm);
  padding: 8px 10px; font: inherit; width: 100%;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--wash);
}

/* --- stat row (hero numbers, not a chart) --------------------------------- */
.stats {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px; padding: 18px 20px 4px;
}
.stat {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--r-md); padding: 13px 15px; box-shadow: var(--shadow);
}
.stat .label {
  font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--muted); font-weight: 600;
}
.stat .value { font-size: 27px; font-weight: 640; letter-spacing: -.02em; margin-top: 3px; }
.stat .sub { font-size: 12px; color: var(--ink-2); }

/* --- panels --------------------------------------------------------------- */
main {
  display: grid; grid-template-columns: minmax(380px, 460px) 1fr;
  gap: 16px; padding: 16px 20px 22px;
  align-items: stretch;            /* equal-height panels: either list may be
                                      the long one, so neither should leave a
                                      ragged gap beside the other */
  min-height: calc(100vh - 210px);
}
section {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden;
  display: flex; flex-direction: column; min-height: 0;
}
section > h2 {
  font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--muted); margin: 0; padding: 13px 16px;
  border-bottom: 1px solid var(--hairline);
  display: flex; align-items: center; gap: 9px; font-weight: 650;
}
.rows { flex: 1; overflow-y: auto; min-height: 0; }
section > h2, .legend { flex: none; }
.row { padding: 13px 16px; border-bottom: 1px solid var(--hairline); }
.row:last-child { border-bottom: none; }
.row.clickable { cursor: pointer; transition: background .1s ease; }
.row.clickable:hover { background: var(--wash); }
.row.selected { background: var(--wash); box-shadow: inset 3px 0 0 var(--accent); }
.title { display: flex; align-items: center; gap: 9px; }
.title .name { font-weight: 560; letter-spacing: -.005em; }
.meta { color: var(--ink-2); font-size: 12.5px; margin-top: 4px; }
.meta .num { font-variant-numeric: tabular-nums; }

/* --- status ---------------------------------------------------------------
   A status pill always carries its glyph AND its word, so the colour is
   reinforcement rather than the message.                                     */
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
          padding: 2px 9px 2px 7px; border-radius: 999px;
          border: 1px solid var(--hairline); background: var(--page); }
.status .glyph { font-size: 10px; line-height: 1; }
.status.empty    { color: var(--accent); }
.status.stale    { color: var(--warning); }
.status.active   { color: var(--good); }
.status.complete { color: var(--muted); }

/* --- stacked health bar ---------------------------------------------------
   Segments are separated by a 2px gap in the surface colour, never a stroke:
   flex-grow carries the proportion so the gaps subtract cleanly.             */
.bar {
  display: flex; gap: 2px; height: 8px; margin-top: 9px;
  background: var(--surface); border-radius: 4px;
}
.bar > span { display: block; border-radius: 2px; min-width: 3px; }
.bar > span:first-child { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
.bar > span:last-child { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
.bar.is-empty { background: var(--grid); }
.breakdown {
  display: flex; flex-wrap: wrap; gap: 10px; margin-top: 7px;
  font-size: 12px; color: var(--ink-2);
}
.breakdown .k { display: inline-flex; align-items: center; gap: 5px; }
.swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.breakdown .n { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }

/* legend: identity is never colour-alone */
.legend {
  display: flex; flex-wrap: wrap; gap: 14px;
  padding: 10px 16px; border-top: 1px solid var(--hairline);
  font-size: 12px; color: var(--ink-2); background: var(--page);
}
.legend .k { display: inline-flex; align-items: center; gap: 6px; }

/* --- tree ----------------------------------------------------------------
   One row per node. The state dot is reinforced by a tooltip, by the legend
   below the panel, and for ready work by the to-do list beside it, so the
   green circle is never the only thing carrying the meaning.               */
.node {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 16px; border-bottom: 1px solid transparent;
  cursor: default; font-size: 13.5px;
}
.node:hover { background: var(--wash); }
.node .twisty {
  width: 16px; height: 16px; flex: none; display: inline-flex;
  align-items: center; justify-content: center; cursor: pointer;
  color: var(--muted); font-size: 10px; border-radius: 3px; user-select: none;
}
.node .twisty:hover { background: var(--hairline); color: var(--ink); }
.node .twisty.leaf { visibility: hidden; cursor: default; }
.node .dot {
  width: 10px; height: 10px; border-radius: 50%; flex: none;
  box-sizing: border-box;
}
.node .dot.hollow { background: transparent !important; border: 1.5px solid var(--neutral); }
.node .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node.kind-project { font-weight: 640; font-size: 14px; padding-top: 11px; }
.node.kind-project:not(:first-child) { border-top: 1px solid var(--hairline); margin-top: 6px; }
.node.kind-milestone { font-weight: 560; }
.node.kind-goal { color: var(--ink-2); }
.node.is-done .label { color: var(--muted); text-decoration: line-through; }
.node.is-dropped .label { color: var(--muted); opacity: .7; text-decoration: line-through; }
.node .tag {
  font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none;
}
.node-extra { padding: 0 16px 10px 40px; }

/* --- to-do ---------------------------------------------------------------- */
.todo { display: flex; align-items: flex-start; gap: 11px; }
.tick {
  width: 18px; height: 18px; border-radius: 50%; flex: none; margin-top: 1px;
  border: 2px solid var(--good); background: transparent; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  color: transparent; font-size: 11px; padding: 0; transition: all .12s ease;
}
.tick:hover { background: var(--good); color: var(--accent-ink); border-color: var(--good); }
.tick:disabled { opacity: .4; cursor: default; }

/* --- ready list ----------------------------------------------------------- */
.rank {
  font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted);
  min-width: 20px; font-weight: 600;
}
.impact { display: inline-flex; gap: 10px; font-variant-numeric: tabular-nums; }
.impact b { font-weight: 650; color: var(--ink); }
.empty-state { padding: 30px 16px; color: var(--muted); text-align: center; font-size: 13px; }

/* waiting: calendar-gated, not pipeline-blocked */
.node .dot.waiting { background: transparent !important; border: 1.5px solid var(--warning); }
.node .edit {
  visibility: hidden; border: none; background: none; color: var(--muted);
  cursor: pointer; padding: 2px 5px; font-size: 12px; border-radius: 4px; flex: none;
}
.node:hover .edit { visibility: visible; }
.node .edit:hover { background: var(--hairline); color: var(--ink); }
.prio {
  font-size: 10px; font-weight: 700; letter-spacing: .05em; padding: 1px 6px;
  border-radius: 4px; text-transform: uppercase; flex: none;
}
.prio.pinned { background: var(--accent); color: var(--accent-ink); }
.prio.high { border: 1px solid var(--warning); color: var(--warning); }
.prio.low { border: 1px solid var(--hairline); color: var(--muted); }
.deps-list { display: grid; gap: 6px; }
.dep-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.dep-row .x { border: none; background: none; color: var(--muted); cursor: pointer; }
.dep-row .x:hover { color: var(--critical); }
.dep-add { display: flex; gap: 8px; }
#graphDlg { width: 92vw; max-width: 92vw; height: 88vh; }
#graphDlg iframe { width: 100%; height: calc(88vh - 100px); border: none; background: white; border-radius: 8px; }
.capture-row { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--hairline); }
.jr-day { padding: 10px 16px; border-bottom: 1px solid var(--hairline); }
.jr-day h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 650; }
.jr-item { display: flex; gap: 8px; font-size: 13px; padding: 2px 0; align-items: baseline; }
.jr-item .when { color: var(--muted); font-size: 11px; flex: none; font-variant-numeric: tabular-nums; }

/* --- dialogs -------------------------------------------------------------- */
dialog {
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: var(--r-lg);
  padding: 0; width: 470px; max-width: 92vw; box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(0,0,0,.5); backdrop-filter: blur(2px); }
dialog h3 { margin: 0; padding: 15px 18px; border-bottom: 1px solid var(--hairline); font-size: 14px; font-weight: 650; }
dialog .body { padding: 18px; display: grid; gap: 14px; }
dialog .actions {
  padding: 13px 18px; border-top: 1px solid var(--hairline);
  display: flex; gap: 9px; justify-content: flex-end; background: var(--page);
}
label { display: grid; gap: 6px; font-size: 12px; color: var(--ink-2); font-weight: 500; }
.hint { font-size: 12px; color: var(--muted); line-height: 1.5; }

/* --- toasts --------------------------------------------------------------- */
#toast { position: fixed; right: 18px; bottom: 18px; max-width: 440px; display: grid; gap: 9px; z-index: 20; }
.toast {
  background: var(--raised); border: 1px solid var(--hairline);
  border-left: 3px solid var(--good); padding: 11px 14px;
  border-radius: var(--r-sm); font-size: 13px; white-space: pre-wrap;
  box-shadow: var(--shadow); animation: rise .18s ease;
}
.toast.err { border-left-color: var(--critical); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
</style>
</head>
<body>

<header>
  <div class="brand"><h1>protracker</h1><span class="ver" id="dbLabel">—</span></div>
  <span class="spacer"></span>
  <button id="btnTheme" class="icon" title="Toggle light / dark">◐</button>
  <button id="btnGraph">Graph</button>
  <button id="btnImport">Import…</button>
  <button id="btnAdd">Add…</button>
  <button id="btnSettings">Settings</button>
  <button id="btnRefresh" class="primary">Refresh</button>
</header>

<div class="stats" id="stats"></div>

<main>
  <section>
    <h2>
      All tasks <span class="spacer"></span>
      <button id="btnExpand" class="tiny">Collapse all</button>
      <span class="chip" id="treeCount"></span>
    </h2>
    <div class="rows" id="tree"><div class="empty-state">Loading…</div></div>
    <div class="legend" id="legend"></div>
  </section>

  <section>
    <h2>
      To do <span class="spacer"></span>
      <span class="chip" id="readyScope">all projects</span>
      <span class="chip" id="readyCount"></span>
    </h2>
    <div class="rows" id="ready" style="flex:2"><div class="empty-state">Loading…</div></div>
    <h2>Today <span class="spacer"></span><span class="chip" id="todayDate"></span></h2>
    <div class="capture-row">
      <input id="capText" placeholder="Thought vomit — notes, results, anything…">
      <button id="capOk" class="primary">Capture</button>
    </div>
    <div class="rows" id="journal" style="flex:1"></div>
  </section>
</main>

<dialog id="impDlg">
  <h3>Import a tracker workbook</h3>
  <div class="body">
    <label>Workbook <input id="impPath" placeholder="Project Tracker.xlsx"></label>
    <div class="hint">
      A relative name resolves inside the project directory. Re-importing the
      same file is safe — rows are matched, not duplicated.
    </div>
  </div>
  <div class="actions">
    <button id="impCancel">Cancel</button>
    <button id="impOk" class="primary">Import</button>
  </div>
</dialog>

<dialog id="addDlg">
  <h3>Add a node</h3>
  <div class="body">
    <label>Kind
      <select id="addKind">
        <option value="project">Project</option>
        <option value="milestone">Milestone</option>
        <option value="goal">Goal</option>
        <option value="task">Task</option>
      </select>
    </label>
    <label>Name <input id="addName" placeholder="e.g. Bridge Retrofit"></label>
    <label id="addParentWrap">Parent <select id="addParent"></select></label>
    <label>Notes (optional) <textarea id="addNotes" rows="2"></textarea></label>
  </div>
  <div class="actions">
    <button id="addCancel">Cancel</button>
    <button id="addOk" class="primary">Create</button>
  </div>
</dialog>

<dialog id="editDlg">
  <h3 id="editTitle">Edit</h3>
  <div class="body">
    <label>Name <input id="edName"></label>
    <label>Notes <textarea id="edNotes" rows="2"></textarea></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <label>Deadline <input id="edDeadline" placeholder="YYYY-MM-DD"></label>
      <label id="edStartWrap">Start (waits until) <input id="edStart" placeholder="YYYY-MM-DD"></label>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px" id="edTaskRow">
      <label>Priority
        <select id="edPriority">
          <option value="">normal</option>
          <option value="pinned">pinned</option>
          <option value="high">high</option>
          <option value="low">low</option>
        </select>
      </label>
      <label>Follow-up after done (days) <input id="edFollow" type="number" min="1"></label>
    </div>
    <label id="edDepsWrap">Depends on
      <div class="deps-list" id="edDeps"></div>
      <div class="dep-add">
        <select id="edDepPick"></select>
        <button id="edDepAdd" class="tiny">Add</button>
      </div>
    </label>
    <label id="edParentWrap">Parent <select id="edParent"></select></label>
  </div>
  <div class="actions">
    <button id="edDelete" style="margin-right:auto;color:var(--critical)">Delete…</button>
    <button id="edCancel">Cancel</button>
    <button id="edOk" class="primary">Save</button>
  </div>
</dialog>

<dialog id="graphDlg">
  <h3>Dependency graph <span class="spacer"></span></h3>
  <div class="body" style="padding:10px">
    <iframe id="graphFrame" title="dependency graph"></iframe>
  </div>
  <div class="actions"><button id="graphClose">Close</button></div>
</dialog>

<dialog id="setDlg">
  <h3>Settings</h3>
  <div class="body">
    <label>Working directory (optional)
      <input id="setDir" placeholder="leave blank to use the default">
    </label>
    <label>Database file <input id="setDb"></label>
    <label>Stale after (days) <input id="setDays" type="number" min="1"></label>
    <div class="hint" id="envInfo"></div>
  </div>
  <div class="actions">
    <button id="setCancel">Cancel</button>
    <button id="setOk" class="primary">Save</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
// ---------------------------------------------------------------------------
// Renders whatever the command layer returns. Readiness, impact and health all
// arrive already decided; nothing here computes them. Keeping it that way is
// what makes this pane deletable.
// ---------------------------------------------------------------------------
const invoke = window.__TAURI__.core.invoke;

const cfg = {
  dir: localStorage.getItem("dir") || "",
  db: localStorage.getItem("db") || "tracker.db",
  days: Number(localStorage.getItem("days") || 30),
};

let state = { projects: [], ready: [], nodes: [], tree: [], selected: null,
              collapsed: new Set() };

// health -> reserved status role. Ordered by severity, which is also the
// stacking order, so a bar reads left-to-right from best to worst.
const HEALTH = [
  { key: "on_track",    label: "on track",     css: "var(--good)",     glyph: "●" },
  { key: "not_begun",   label: "not begun",    css: "var(--neutral)",  glyph: "○" },
  { key: "off_track",   label: "off track",    css: "var(--warning)",  glyph: "◐" },
  { key: "wont_finish", label: "won't finish", css: "var(--critical)", glyph: "▲" },
];
const BY_KEY = Object.fromEntries(HEALTH.map((h) => [h.key, h]));
const STATE_GLYPH = { empty: "○", stale: "◐", active: "●", complete: "✓" };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function toast(msg, isError) {
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " err" : "");
  el.textContent = msg;
  $("toast").appendChild(el);
  setTimeout(() => el.remove(), isError ? 9000 : 5000);
}

/* Turn whatever the bridge rejected with into something a person can act on.
   Three shapes arrive here: a plain string (Tauri's Err), a JSON document
   (the CLI's structured CommandError, handed back verbatim on a non-zero
   exit), and an Error object. JSON.stringify on the last of those yields
   "{\"name\":\"Error\"}", which is how a failed import used to report itself. */
function errText(e) {
  if (e && typeof e === "object") e = e.message ?? e.error ?? String(e);
  if (typeof e !== "string") {
    try { return JSON.stringify(e); } catch { return String(e); }
  }
  try {
    const parsed = JSON.parse(e);
    const msg = parsed?.error?.message ?? parsed?.message;
    if (msg) return String(msg);
  } catch { /* not JSON: it is already the message */ }
  return e.trim() || "the command failed without a message";
}

async function pt(...args) {
  try {
    return await invoke("pt", { projectDir: cfg.dir, db: cfg.db, args });
  } catch (e) {
    toast(errText(e), true);
    throw e;
  }
}

// --- rendering -------------------------------------------------------------

function healthBar(health, total) {
  if (!total) return `<div class="bar is-empty" role="img" aria-label="no open tasks"></div>`;
  const segs = HEALTH.filter((h) => health?.[h.key])
    .map((h) => `<span style="flex:${health[h.key]} 1 0;background:${h.css}"
                        title="${esc(h.label)}: ${health[h.key]}"></span>`);
  return `<div class="bar">${segs.join("")}</div>`;
}

function breakdown(health) {
  const parts = HEALTH.filter((h) => health?.[h.key]).map((h) =>
    `<span class="k"><span class="swatch" style="background:${h.css}"></span>
     <span class="n">${health[h.key]}</span> ${esc(h.label)}</span>`);
  return parts.length ? `<div class="breakdown">${parts.join("")}</div>` : "";
}

function renderStats() {
  const p = state.projects;
  const openTasks = p.reduce((a, r) => a + r.tasks_open, 0);
  const doneTasks = p.reduce((a, r) => a + r.tasks_done, 0);
  const total = p.reduce((a, r) => a + r.tasks_total, 0);
  const attention = p.filter((r) => r.state === "stale" || r.state === "empty").length;
  const pct = total ? Math.round((doneTasks / total) * 100) : 0;
  const tiles = [
    { label: "Projects", value: p.length, sub: `${attention} need attention` },
    { label: "Ready now", value: state.ready.length, sub: "unblocked tasks" },
    { label: "Open", value: openTasks, sub: `of ${total} tasks` },
    { label: "Completed", value: `${pct}%`, sub: `${doneTasks} done` },
  ];
  $("stats").innerHTML = tiles.map((t) => `
    <div class="stat">
      <div class="label">${esc(t.label)}</div>
      <div class="value">${esc(t.value)}</div>
      <div class="sub">${esc(t.sub)}</div>
    </div>`).join("");
}

function renderLegend() {
  const dots = [
    ["ready", "var(--good)", false],
    ["waiting", "var(--warning)", true],
    ["blocked", "var(--neutral)", true],
    ["in progress", "var(--accent)", false],
  ].map(([label, css, hollow]) =>
    `<span class="k"><span class="dot${hollow ? " hollow" : ""}"
      style="background:${css}"></span>${esc(label)}</span>`).join("");
  const health = HEALTH.map((h) =>
    `<span class="k"><span class="swatch" style="background:${h.css}"></span>${esc(h.label)}</span>`
  ).join("");
  $("legend").innerHTML = dots + health;
}

// Derived task state -> how its dot reads. 'ready' is the green circle.
const TASK_STATE = {
  ready:       { css: "var(--good)",    hollow: false, label: "ready" },
  waiting:     { css: "var(--warning)", hollow: true,  label: "waiting", cls: "waiting" },
  in_progress: { css: "var(--accent)",  hollow: false, label: "in progress" },
  blocked:     { css: "var(--neutral)", hollow: true,  label: "blocked" },
  done:        { css: "var(--neutral)", hollow: false, label: "done" },
  dropped:     { css: "var(--neutral)", hollow: true,  label: "dropped" },
};

function countNodes(entries) {
  return entries.reduce((a, e) => a + 1 + countNodes(e.children || []), 0);
}

function nodeRow(entry, depth) {
  const n = entry.node;
  const kids = entry.children || [];
  const open = !state.collapsed.has(n.id);
  const twisty = kids.length
    ? `<span class="twisty" data-toggle="${n.id}">${open ? "▾" : "▸"}</span>`
    : `<span class="twisty leaf">·</span>`;

  let dot = "", extra = "", cls = "";
  if (n.kind === "task") {
    const st = TASK_STATE[n.state] || TASK_STATE.blocked;
    dot = `<span class="dot${st.cls ? " " + st.cls : st.hollow ? " hollow" : ""}"
                 style="background:${st.css}"
                 title="${esc(st.label)}" aria-label="${esc(st.label)}"></span>`;
    if (n.state === "done") cls = " is-done";
    if (n.state === "dropped") cls = " is-dropped";
  }

  let tag = "";
  if (n.kind === "project") {
    const p = state.projects.find((r) => r.project_id === n.id);
    if (p) {
      tag = `<span class="status ${p.state}"><span class="glyph">${
        STATE_GLYPH[p.state] || "•"}</span>${esc(p.state)}</span>`;
      extra = `<div class="node-extra">${healthBar(p.health, p.tasks_open)}${
        breakdown(p.health)}</div>`;
    }
  }

  const rows = [`
    <div class="node kind-${n.kind}${cls}" style="padding-left:${16 + depth * 18}px"
         data-id="${n.id}" data-kind="${n.kind}">
      ${twisty}${dot}
      <span class="label" title="${esc(n.name)}">${esc(n.name)}</span>
      ${tag}
      <button class="edit" data-edit="${n.id}" title="Edit" aria-label="Edit ${esc(n.name)}">✎</button>
    </div>`];
  if (n.kind === "project" && open && extra) rows.push(extra);
  if (open) for (const c of kids) rows.push(nodeRow(c, depth + 1));
  return rows.join("");
}

function renderTree() {
  const box = $("tree");
  $("treeCount").textContent = `${countNodes(state.tree)} nodes`;
  if (!state.tree.length) {
    box.innerHTML = `<div class="empty-state">Nothing here yet — use <b>Import…</b> or <b>Add…</b>.</div>`;
    return;
  }
  box.innerHTML = state.tree.map((r) => nodeRow(r, 0)).join("");

  box.querySelectorAll("[data-toggle]").forEach((el) => {
    el.onclick = (ev) => {
      ev.stopPropagation();
      const id = Number(el.dataset.toggle);
      state.collapsed.has(id) ? state.collapsed.delete(id) : state.collapsed.add(id);
      renderTree();
    };
  });
  box.querySelectorAll("[data-edit]").forEach((el) => {
    el.onclick = (ev) => { ev.stopPropagation(); openEdit(Number(el.dataset.edit)); };
  });
  // clicking a project row scopes the to-do list to it
  box.querySelectorAll('.node[data-kind="project"]').forEach((el) => {
    el.onclick = () => {
      const pid = Number(el.dataset.id);
      state.selected = state.selected === pid ? null : pid;
      renderReady();
    };
  });
}

function collectIds(entries, out = []) {
  for (const e of entries) {
    if ((e.children || []).length) out.push(e.node.id);
    collectIds(e.children || [], out);
  }
  return out;
}

function renderReady() {
  const box = $("ready");
  const shown = state.selected === null
    ? state.ready
    : state.ready.filter((t) => t.project_id === state.selected);

  $("readyScope").textContent = state.selected === null
    ? "all projects"
    : (state.projects.find((p) => p.project_id === state.selected)?.project_name || "planner");
  $("readyCount").textContent = shown.length;

  if (!shown.length) {
    box.innerHTML = `<div class="empty-state">Nothing ready here.</div>`;
    return;
  }
  box.innerHTML = shown.map((t) => {
    const h = BY_KEY[t.health] || { label: "unset", css: "var(--muted)" };
    return `
    <div class="row">
      <div class="todo">
        <button class="tick" data-done="${t.id}" title="Mark done"
                aria-label="Mark “${esc(t.name)}” done">✓</button>
        <div style="flex:1;min-width:0">
          <div class="title"><span class="name">${esc(t.name)}</span>${
            t.priority ? `<span class="prio ${t.priority}">${esc(t.priority)}</span>` : ""}</div>
          <div class="meta">
            <span class="impact">
              <span>unlocks <b>${t.unlocks_now}</b></span>
              <span>gates <b>${t.gates_total}</b></span>
            </span>
            · <span class="k"><span class="swatch" style="display:inline-block;background:${h.css}"></span>
            ${esc(h.label)}</span>
            · #${t.id} · ${esc(t.project_name || "planner")}${
              t.deadline ? " · due " + esc(t.deadline) : ""}
          </div>
        </div>
      </div>
    </div>`;
  }).join("");

  box.querySelectorAll("[data-done]").forEach((btn) => {
    btn.onclick = async () => {
      btn.disabled = true;
      const res = await pt("done", btn.dataset.done);
      let msg = `Completed “${res.completed.name}”.`;
      const unlocked = res.newly_ready || [];
      if (unlocked.length) msg += "\nNow ready: " + unlocked.map((n) => n.name).join(", ");
      for (const key of ["completed_goals", "completed_milestones", "completed_projects"]) {
        for (const n of res[key] || []) msg += `\nFinished ${n.kind}: ${n.name}`;
      }
      toast(msg);
      await refresh();
    };
  });
}

// --- data ------------------------------------------------------------------

async function refresh() {
  $("dbLabel").textContent = cfg.db;
  // No directory gate: an installed build carries its own CLI and falls back
  // to a per-user data directory, so it works before anything is configured.
  const [projects, ready, nodes, tree, journal] = await Promise.all([
    pt("progress", "--days", String(cfg.days)),
    pt("ready", "--impact"),
    pt("ls"),
    pt("tree"),
    pt("journal", "--days", "7"),
  ]);
  state.projects = projects;
  state.ready = ready;
  state.nodes = nodes;
  state.tree = tree;
  state.journal = journal;
  renderStats();
  renderLegend();
  renderTree();
  renderReady();
  renderJournal();
}

function renderJournal() {
  const days = state.journal || [];
  $("todayDate").textContent = days[0]?.date || "";
  const shown = days.filter((d, i) => i === 0 || d.completed.length || d.notes.length);
  $("journal").innerHTML = shown.map((d) => `
    <div class="jr-day">
      <h4>${esc(d.date)}</h4>
      ${d.completed.map((n) => `
        <div class="jr-item"><span class="when">${esc((n.completed_at || "").slice(11, 16))}</span>
          <span style="color:var(--good)">✓</span> <span>${esc(n.name)}</span></div>`).join("")}
      ${d.notes.map((n) => `
        <div class="jr-item"><span class="when">${esc((n.created_at || "").slice(11, 16))}</span>
          <span style="color:var(--muted)">✎</span> <span>${esc(n.text)}</span></div>`).join("")}
      ${!d.completed.length && !d.notes.length
        ? `<div class="jr-item" style="color:var(--muted)">nothing yet — capture a thought above</div>` : ""}
    </div>`).join("");
}

$("capOk").onclick = async () => {
  const text = $("capText").value.trim();
  if (!text) return;
  await pt("capture", text);
  $("capText").value = "";
  state.journal = await pt("journal", "--days", "7");
  renderJournal();
};
$("capText").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("capOk").click();
});

$("btnExpand").onclick = () => {
  const all = collectIds(state.tree);
  if (state.collapsed.size) {
    state.collapsed.clear();
    $("btnExpand").textContent = "Collapse all";
  } else {
    all.forEach((id) => state.collapsed.add(id));
    $("btnExpand").textContent = "Expand all";
  }
  renderTree();
};

// --- dialogs ---------------------------------------------------------------

const PARENT_KIND = { milestone: "project", goal: "milestone", task: "goal" };

function refreshParentOptions() {
  const kind = $("addKind").value;
  const wrap = $("addParentWrap");
  const sel = $("addParent");
  if (kind === "project") { wrap.style.display = "none"; return; }
  wrap.style.display = "grid";
  const want = PARENT_KIND[kind];
  const options = state.nodes.filter((n) => n.kind === want);
  sel.innerHTML = options.length
    ? options.map((n) => `<option value="${n.id}">${esc(n.name)} (#${n.id})</option>`).join("")
    : `<option value="">— no ${want} exists yet —</option>`;
}

$("btnAdd").onclick = () => { refreshParentOptions(); $("addDlg").showModal(); };
$("addKind").onchange = refreshParentOptions;
$("addCancel").onclick = () => $("addDlg").close();
$("addOk").onclick = async () => {
  const kind = $("addKind").value;
  const name = $("addName").value.trim();
  const parent = $("addParent").value;
  const notes = $("addNotes").value.trim();
  if (!name) return toast("Name is required.", true);
  if (kind !== "project" && !parent) return toast(`Create a ${PARENT_KIND[kind]} first.`, true);
  const args = ["add", kind, name];
  if (kind !== "project") args.push("--parent", parent);
  if (notes) args.push("--desc", notes);
  const res = await pt(...args);
  $("addDlg").close();
  $("addName").value = ""; $("addNotes").value = "";
  toast(`Created ${res.created.kind} “${res.created.name}” (#${res.created.id}).`);
  await refresh();
};

$("btnImport").onclick = () => {
  $("impPath").value = localStorage.getItem("lastImport") || "";
  $("impDlg").showModal();
};
$("impCancel").onclick = () => $("impDlg").close();
/* Explorer's "Copy as path" yields a quoted path. Argv goes straight to the
   CLI with no shell to strip them, so clean them here too and show the user
   the cleaned value rather than silently sending something else. */
function cleanPath(raw) {
  let p = (raw || "").trim();
  while (p.length >= 2 && p[0] === p[p.length - 1] && (p[0] === '"' || p[0] === "'")) {
    p = p.slice(1, -1).trim();
  }
  return p;
}

$("impOk").onclick = async () => {
  const path = cleanPath($("impPath").value);
  $("impPath").value = path;
  if (!path) return toast("Give the workbook's name or full path.", true);
  $("impOk").disabled = true;
  try {
    const r = await pt("import", path);
    localStorage.setItem("lastImport", path);
    $("impDlg").close();
    let msg = `Imported: ${r.created.length} created, ${r.updated.length} updated, ${r.unchanged} unchanged.`;
    for (const s of r.skipped_sheets || []) msg += `\nSkipped sheet “${s.sheet}”.`;
    if (r.review?.length) msg += `\n${r.review.length} row(s) need review.`;
    if (r.flagged?.length) msg += `\n${r.flagged.length} note(s) flagged as possible dependencies.`;
    toast(msg);
    for (const item of (r.review || []).slice(0, 6)) {
      toast(`review · ${item.sheet} row ${item.row}: ${item.reason}`, true);
    }
    await refresh();
  } finally { $("impOk").disabled = false; }
};

$("btnSettings").onclick = async () => {
  $("setDir").value = cfg.dir; $("setDb").value = cfg.db; $("setDays").value = cfg.days;
  $("envInfo").textContent = "";
  $("setDlg").showModal();
  // say plainly what the app is talking to and where it will write
  try {
    const info = await invoke("env_info", { projectDir: cfg.dir });
    $("envInfo").textContent =
      (info.bundled
        ? "Using the bundled CLI — no Python needed. "
        : "Using system Python — this build has no bundled CLI, so it needs "
          + "Python and the protracker package. ")
      + `Data is written to ${info.working_dir}.`;
  } catch { /* older build without env_info: leave the hint blank */ }
};
$("setCancel").onclick = () => $("setDlg").close();
$("setOk").onclick = async () => {
  cfg.dir = $("setDir").value.trim();
  cfg.db = $("setDb").value.trim() || "tracker.db";
  cfg.days = Number($("setDays").value) || 30;
  localStorage.setItem("dir", cfg.dir);
  localStorage.setItem("db", cfg.db);
  localStorage.setItem("days", String(cfg.days));
  $("setDlg").close();
  await refresh();
};

// --- edit dialog -----------------------------------------------------------
const PARENT_OF = { milestone: "project", goal: "milestone", task: "goal" };
let editing = null;

async function openEdit(id) {
  const detail = await pt("show", String(id));
  const n = detail.node;
  editing = { id, node: n, deps: detail.dependencies_in || [] };
  $("editTitle").textContent = `Edit ${n.kind} #${n.id}`;
  $("edName").value = n.name || "";
  $("edNotes").value = n.description || "";
  $("edDeadline").value = n.deadline || "";
  $("edStart").value = n.earliest_start || "";
  const isTask = n.kind === "task";
  $("edTaskRow").style.display = isTask ? "grid" : "none";
  $("edStartWrap").style.display = isTask ? "grid" : "none";
  if (isTask) {
    $("edPriority").value = n.priority || "";
    $("edFollow").value = n.followup_days || "";
  }
  // deps apply to tasks and goals
  const depOk = isTask || n.kind === "goal";
  $("edDepsWrap").style.display = depOk ? "grid" : "none";
  if (depOk) renderDeps();
  // parent picker (projects stay roots)
  const wantParent = PARENT_OF[n.kind];
  $("edParentWrap").style.display = wantParent ? "grid" : "none";
  if (wantParent) {
    $("edParent").innerHTML = state.nodes
      .filter((x) => x.kind === wantParent)
      .map((x) => `<option value="${x.id}" ${x.id === n.parent_id ? "selected" : ""}>${esc(x.name)} (#${x.id})</option>`)
      .join("") + (isTask ? `<option value="" ${n.parent_id == null ? "selected" : ""}>— planner (no parent) —</option>` : "");
  }
  $("editDlg").showModal();
}

function renderDeps() {
  const n = editing.node;
  $("edDeps").innerHTML = editing.deps.map((d) => `
    <div class="dep-row">
      <button class="x" data-deprm="${d.from_id}" title="Remove dependency">✕</button>
      <span>${esc(d.from_name)} (#${d.from_id})</span>
    </div>`).join("") || `<div class="dep-row" style="color:var(--muted)">none</div>`;
  $("edDeps").querySelectorAll("[data-deprm]").forEach((el) => {
    el.onclick = async () => {
      await pt("dep", "rm", el.dataset.deprm, String(n.id));
      editing.deps = editing.deps.filter((d) => d.from_id !== Number(el.dataset.deprm));
      renderDeps();
      await refresh();
    };
  });
  $("edDepPick").innerHTML = state.nodes
    .filter((x) => (x.kind === "goal" || x.kind === "task") && x.id !== n.id)
    .map((x) => `<option value="${x.id}">${esc(x.kind)}: ${esc(x.name)} (#${x.id})</option>`)
    .join("");
}

$("edDepAdd").onclick = async () => {
  const from = $("edDepPick").value;
  if (!from) return;
  const r = await pt("dep", "add", from, String(editing.id));
  editing.deps.push({ from_id: Number(from), from_name:
    state.nodes.find((x) => x.id === Number(from))?.name || `#${from}` });
  renderDeps();
  await refresh();
};

$("edCancel").onclick = () => $("editDlg").close();
$("edOk").onclick = async () => {
  const n = editing.node;
  const args = ["set", String(editing.id)];
  const name = $("edName").value.trim();
  if (name && name !== n.name) args.push("--name", name);
  const notes = $("edNotes").value.trim();
  if (notes !== (n.description || "")) args.push("--desc", notes || " ");
  const dl = $("edDeadline").value.trim();
  if (dl !== (n.deadline || "") && dl) args.push("--deadline", dl);
  if (n.kind === "task") {
    const st = $("edStart").value.trim();
    if (st !== (n.earliest_start || "") && st) args.push("--earliest-start", st);
    const pr = $("edPriority").value || "none";
    if ((n.priority || "") !== ($("edPriority").value || "")) args.push("--priority", pr);
    const fu = $("edFollow").value;
    if (fu && Number(fu) !== n.followup_days) args.push("--followup-days", fu);
  }
  if (args.length > 2) {
    await pt(...args);
    toast(`Saved ${n.kind} “${name || n.name}”.`);
  }
  // re-parent if changed
  const wantParent = PARENT_OF[n.kind];
  if (wantParent) {
    const sel = $("edParent").value;
    const target = sel === "" ? null : Number(sel);
    if (target !== n.parent_id) {
      await pt(...(target === null ? ["mv", String(editing.id), "--root"]
                                   : ["mv", String(editing.id), "--parent", String(target)]));
      toast("Moved.");
    }
  }
  $("editDlg").close();
  await refresh();
};

$("edDelete").onclick = async () => {
  const n = editing.node;
  const preview = await pt("rm", String(editing.id));
  if (preview.requires_confirm) {
    const what = (preview.descendants || []).length;
    if (!confirm(`Delete ${n.kind} “${n.name}” and ${what} node(s) beneath/depending on it?`)) return;
    await pt("rm", String(editing.id), "--yes");
  }
  toast(`Deleted ${n.kind} “${n.name}”.`);
  $("editDlg").close();
  await refresh();
};

// --- graph modal ------------------------------------------------------------
$("btnGraph").onclick = async () => {
  try {
    const html = await invoke("graph_html", { projectDir: cfg.dir, db: cfg.db });
    $("graphFrame").srcdoc = html;
    $("graphDlg").showModal();
  } catch (e) { toast(errText(e), true); }
};
$("graphClose").onclick = () => $("graphDlg").close();

$("btnTheme").onclick = () => {
  const now = document.documentElement.getAttribute("data-theme");
  const next = now === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
};
const savedTheme = localStorage.getItem("theme");
if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);

$("btnRefresh").onclick = refresh;
refresh();
</script>
