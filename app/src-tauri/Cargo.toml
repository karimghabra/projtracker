[package]
name = "protracker-app"
version = "0.1.0"
edition = "2021"
description = "Desktop shell for the protracker CLI"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true
