<title>protracker graph</title>
<style>
  :root {
    color-scheme: light;
    --page: #f6f5f1;
    --surface: #fdfdfb;
    --surface-2: #efeee9;
    --ink: #171614;
    --ink-2: #57554f;
    --muted: #8b8880;
    --hairline: #e3e1d9;
    --ring: rgba(23, 22, 20, 0.10);
    --good: #0ca30c;
    --good-wash: rgba(12, 163, 12, 0.09);
    --busy: #2a78d6;
    --up: #2a78d6;
    --down: #eb6834;
    --edge: #a9a69d;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "Cascadia Mono", ui-monospace, "SF Mono", Consolas, monospace;
    /* overview band geometry — rail labels and blocks share these */
    --h-p: 46px;
    --h-m: 40px;
    --h-g: 72px;
    --band-gap: 36px;
    --gap-mg: 158px; /* milestone -> goal gutter: the link-lane bus lives here */
    --w-goal: 168px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #121210;
      --surface: #1d1d1a;
      --surface-2: #242420;
      --ink: #f2f1ec;
      --ink-2: #b8b6ac;
      --muted: #8b8880;
      --hairline: #2e2d29;
      --ring: rgba(242, 241, 236, 0.10);
      --good: #0ca30c;
      --good-wash: rgba(12, 163, 12, 0.14);
      --busy: #3987e5;
      --up: #3987e5;
      --down: #d95926;
      --edge: #6b6a63;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #121210;
    --surface: #1d1d1a;
    --surface-2: #242420;
    --ink: #f2f1ec;
    --ink-2: #b8b6ac;
    --muted: #8b8880;
    --hairline: #2e2d29;
    --ring: rgba(242, 241, 236, 0.10);
    --good: #0ca30c;
    --good-wash: rgba(12, 163, 12, 0.14);
    --busy: #3987e5;
    --up: #3987e5;
    --down: #d95926;
    --edge: #6b6a63;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --page: #f6f5f1;
    --surface: #fdfdfb;
    --surface-2: #efeee9;
    --ink: #171614;
    --ink-2: #57554f;
    --muted: #8b8880;
    --hairline: #e3e1d9;
    --ring: rgba(23, 22, 20, 0.10);
    --good: #0ca30c;
    --good-wash: rgba(12, 163, 12, 0.09);
    --busy: #2a78d6;
    --up: #2a78d6;
    --down: #eb6834;
    --edge: #a9a69d;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 14px/1.45 var(--sans);
  }
  .mono { font-family: var(--mono); }

  /* ===== toolbar ===== */
  header {
    position: sticky; top: 0; z-index: 30;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
    padding: 10px 20px;
    background: var(--page);
    border-bottom: 1px solid var(--hairline);
  }
  .wordmark { display: flex; align-items: baseline; gap: 10px; }
  .wordmark .cmd { font-family: var(--mono); font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
  .wordmark .cmd::before { content: "▸ "; color: var(--muted); font-weight: 400; }
  .wordmark .sub { font-size: 11px; color: var(--muted); }
  .stats { display: flex; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--mono); font-size: 10.5px; font-variant-numeric: tabular-nums;
    color: var(--ink-2);
    background: var(--surface-2);
    border-radius: 999px; padding: 2px 9px;
  }
  .chip .dot { width: 7px; height: 7px; }
  .views { display: inline-flex; border: 1px solid var(--hairline); border-radius: 7px; overflow: hidden; background: var(--surface); }
  .views button {
    all: unset; cursor: pointer; padding: 4px 13px;
    font-family: var(--mono); font-size: 11px; color: var(--ink-2);
  }
  .views button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
  .views button:focus-visible { outline: 2px solid var(--busy); outline-offset: -2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 11px; color: var(--ink-2); }
  .legend .grp { color: var(--muted); font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em; margin-right: -4px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .controls { margin-left: auto; display: flex; gap: 14px; font-size: 11.5px; color: var(--ink-2); }
  .controls label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }

  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.ready { background: var(--good); }
  .dot.blocked { background: transparent; border: 1.5px solid var(--muted); }
  .dot.in_progress { background: var(--busy); }
  .dot.done { background: var(--muted); }
  .dot.dropped { background: transparent; border: 1.5px dashed var(--muted); }
  .edgekey { width: 18px; height: 0; border-top: 2px solid var(--edge); }
  .edgekey.dashed { border-top-style: dashed; }
  .edgekey.up { border-color: var(--up); }
  .edgekey.down { border-color: var(--down); }

  .view-wrap { overflow: auto; height: calc(100vh - 47px); }

  /* ===== overview (hierarchy tree) view =====
     Hierarchy is expressed purely by position: each band is one kind, and
     children sit inside their parent's block — no connectors needed. */
  #forest {
    position: relative;
    display: flex; align-items: flex-start; gap: 34px;
    padding: 20px 26px 60px 0;
    width: max-content; min-width: 100%;
  }
  #ovsvg { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: visible; }
  .rail {
    position: sticky; left: 0; z-index: 6;
    flex: none; width: 78px; align-self: stretch;
    background: linear-gradient(to right, var(--page) 82%, transparent);
  }
  .rail span {
    position: absolute; left: 22px;
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--muted);
  }
  .rail .lab-p { top: calc(var(--h-p) / 2 - 7px); }
  .rail .lab-m { top: calc(var(--h-p) + var(--band-gap) + var(--h-m) / 2 - 7px); }
  .rail .lab-g { top: calc(var(--h-p) + var(--band-gap) + var(--h-m) + var(--gap-mg) + var(--h-g) / 2 - 7px); }
  .rail .lab-t { top: calc(var(--h-p) + var(--band-gap) + var(--h-m) + var(--gap-mg) + var(--h-g) + var(--band-gap)); }

  .proj-block { display: flex; flex-direction: column; gap: var(--band-gap); flex: none; }
  .pcard {
    height: var(--h-p);
    background: var(--surface);
    border: 1px solid var(--ring); border-radius: 7px;
    padding: 6px 12px;
    display: flex; flex-direction: column; justify-content: center;
    position: relative; z-index: 1;
  }
  /* labels stay readable while their wide spanning card scrolls */
  .pcard .sticklab, .mcard .sticklab {
    position: sticky; left: 90px; width: max-content; max-width: 100%;
    display: flex; flex-direction: column;
  }
  .pcard .pname { font-weight: 650; font-size: 13px; white-space: nowrap; }
  .pcard .pmeta { font-family: var(--mono); font-size: 9.5px; color: var(--muted); }
  .ms-row { display: flex; gap: 14px; align-items: flex-start; }
  .ms-block { display: flex; flex-direction: column; gap: var(--gap-mg); }
  .mcard {
    height: var(--h-m);
    background: var(--surface-2);
    border: 1px solid var(--ring); border-radius: 7px;
    padding: 5px 11px;
    display: flex; flex-direction: column; justify-content: center;
    position: relative; z-index: 1;
  }
  .mcard .mname { font-weight: 600; font-size: 11.5px; white-space: nowrap; }
  .mcard .mmeta { font-family: var(--mono); font-size: 9px; color: var(--muted); }
  .mspacer { height: var(--h-m); }
  .goal-row { display: flex; gap: 10px; align-items: flex-start; }
  .goal-col { display: flex; flex-direction: column; gap: var(--band-gap); width: var(--w-goal); flex: none; }
  .gcard {
    height: var(--h-g); overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--ring); border-radius: 7px;
    padding: 7px 10px 6px;
    cursor: pointer;
    position: relative; z-index: 1;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .gcard .gname {
    font-weight: 600; font-size: 12px; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .gcard .gmeta { display: flex; align-items: center; gap: 6px; }
  .gcard .count { font-family: var(--mono); font-size: 9.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .gcard .links { margin-left: auto; font-family: var(--mono); font-size: 9.5px; color: var(--muted); }
  .gcard .links .in { color: var(--up); }
  .gcard .links .out { color: var(--down); }
  .gcard .dots { display: flex; gap: 3px; }
  .gcard .dots i { width: 6px; height: 6px; border-radius: 50%; }
  .gcard .dots i.blocked { border-width: 1px; }
  .tasks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
  .task {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 4px; border-radius: 4px;
    font-size: 11px; color: var(--ink-2); cursor: pointer;
    position: relative; z-index: 1;
    background: var(--page); /* occludes link lines passing behind the row */
  }
  .task .tname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task.done .tname { text-decoration: line-through; text-decoration-color: var(--muted); }
  .task .dot { width: 7px; height: 7px; }

  /* ===== dependencies (DAG) view ===== */
  #dag {
    position: relative;
    display: flex; gap: 54px; align-items: stretch;
    padding: 44px 28px 40px;
    width: max-content; min-width: 100%;
    min-height: min(620px, calc(100vh - 120px));
  }
  #dagsvg { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: visible; }
  .dcol {
    position: relative;
    display: flex; flex-direction: column; justify-content: center; gap: 20px;
    width: 212px; flex: none;
    padding-top: 10px;
  }
  .depthlab {
    position: absolute; top: -26px; left: 2px;
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
  }
  .dcard {
    position: relative; z-index: 1;
    background: var(--surface);
    border: 1px solid var(--ring); border-radius: 7px;
    padding: 9px 11px 8px; cursor: pointer;
  }
  .dcard .crumbs {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dcard .gname { font-weight: 600; font-size: 12.5px; line-height: 1.3; margin-top: 1px; text-wrap: balance; }
  .dcard .meta { display: flex; align-items: center; gap: 7px; margin-top: 6px; min-height: 14px; }
  .dcard .count { font-family: var(--mono); font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dcard .dots { display: flex; gap: 3px; }
  .dcard .dots i { width: 6px; height: 6px; border-radius: 50%; }
  .dcard .dots i.blocked { border-width: 1px; }
  .nowchip {
    margin-left: auto;
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--good); background: var(--good-wash);
    border-radius: 999px; padding: 1px 7px;
  }

  /* focus states (both views) */
  .dimmed .gcard, .dimmed .task, .dimmed .dcard { opacity: 0.3; }
  .gcard.hit, .task.hit, .dcard.hit { opacity: 1; }
  .gcard.focused, .task.focused, .dcard.focused { outline: 2px solid var(--ink); outline-offset: 1px; opacity: 1; }
  .task:hover, .gcard:hover, .dcard:hover { background: color-mix(in srgb, var(--ink) 5%, var(--surface)); }
  :focus-visible { outline: 2px solid var(--busy); outline-offset: 1px; }

  /* ===== detail panel ===== */
  #panel {
    position: fixed; top: 47px; right: 0; bottom: 0; width: 324px; z-index: 40;
    background: var(--surface);
    border-left: 1px solid var(--hairline);
    padding: 16px 18px 24px; overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.15s ease-out;
  }
  @media (prefers-reduced-motion: reduce) { #panel { transition: none; } }
  #panel.open { transform: none; }
  #panel .kind {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 3px;
  }
  #panel h2 { font-size: 15.5px; margin: 0 0 4px; text-wrap: balance; line-height: 1.3; }
  #panel .ref { font-family: var(--mono); font-size: 10.5px; color: var(--muted); word-break: break-all; }
  #panel .staterow { display: flex; align-items: center; gap: 6px; margin: 12px 0 2px; font-size: 12.5px; color: var(--ink-2); }
  #panel dl { margin: 8px 0 0; font-size: 12.5px; }
  #panel dt {
    font-family: var(--mono); color: var(--muted); font-size: 9.5px;
    text-transform: uppercase; letter-spacing: 0.08em; margin-top: 13px;
  }
  #panel dd { margin: 3px 0 0; color: var(--ink-2); }
  #panel .note { font-style: italic; line-height: 1.5; }
  #panel .chainchips { display: flex; gap: 6px; margin-top: 3px; }
  #panel .linklist { margin: 2px 0 0; padding: 0; list-style: none; }
  #panel .linklist li { margin: 4px 0; }
  #panel .linklist button {
    all: unset; cursor: pointer; color: var(--ink-2);
    display: inline-flex; align-items: baseline; gap: 6px; font-size: 12.5px; line-height: 1.35;
  }
  #panel .linklist button:hover { color: var(--ink); text-decoration: underline; }
  #panel .linklist .via { font-family: var(--mono); color: var(--muted); font-size: 9.5px; }
  #panel .arrow.up { color: var(--up); }
  #panel .arrow.down { color: var(--down); }
  #panel .close {
    all: unset; cursor: pointer; float: right; color: var(--muted);
    font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 4px;
  }
  #panel .close:hover { color: var(--ink); background: var(--surface-2); }
  #panel .esc { font-family: var(--mono); font-size: 9.5px; color: var(--muted); margin-top: 18px; }
  .tagchip {
    display: inline-block; font-family: var(--mono); font-size: 10px; color: var(--ink-2);
    border: 1px solid var(--hairline); border-radius: 999px;
    padding: 0 7px; margin: 2px 3px 0 0;
  }
  #source {
    position: fixed; left: 14px; bottom: 10px; z-index: 20;
    font-family: var(--mono); font-size: 9.5px; color: var(--muted);
    pointer-events: none;
  }

  /* live mode: embedded in the app with a verb bridge */
  .tickb, .editb {
    display: none; border: none; background: none; cursor: pointer;
    font-size: 10px; padding: 0 3px; color: var(--muted); flex: none; line-height: 1;
  }
  .tickb:hover { color: var(--ready, #0ca30c); }
  .editb:hover { color: var(--fg); }
  body.live .task:hover .tickb, body.live .task:hover .editb,
  body.live .gcard:hover .editb { display: inline-block; }
  #linkMode.armed { outline: 2px solid var(--up, #2a78d6); }
  .linksrc { outline: 2px dashed var(--up, #2a78d6); outline-offset: 1px; }
  body.linking .gcard, body.linking .task { cursor: crosshair; }
  /* density: the board scales as one unit so every project fits on screen */
  #forest, #dag { transform-origin: top left; }
</style>

  <div class="wordmark">
    <span class="cmd">pt graph</span>

  </div>
  <div class="stats" id="stats"></div>
  <div class="views" role="group" aria-label="view">
    <button id="btnForest" aria-pressed="true">overview</button>
    <button id="btnDag" aria-pressed="false">dependencies</button>
  </div>
  <div class="legend">
    <span class="grp">tasks</span>

    <span class="grp">links</span>
    <span><i class="edgekey"></i>depends on</span>
    <span><i class="edgekey dashed"></i>task-level</span>
    <span><i class="edgekey up"></i>prereqs</span>

  </div>
  <div class="controls">
    <label id="allLinksWrap"><input type="checkbox" id="allLinks"> show all links</label>
    <label id="zoomWrap" title="zoom">&#128269;
      <input type="range" id="zoom" min="50" max="100" value="80" style="width:90px;vertical-align:middle">

</header>

</div>

<div id="source">__SOURCE__</div>

<script>
  const DATA = __DATA__;
  const nodes = DATA.nodes, deps = DATA.deps;
  const byId = new Map(nodes.map(n => [n.id, n]));
  const kids = new Map();
  nodes.forEach(n => {
    if (n.parent_id != null) {
      if (!kids.has(n.parent_id)) kids.set(n.parent_id, []);
      kids.get(n.parent_id).push(n);
    }
  });
  kids.forEach(list => list.sort((a, b) => (a.seq_index ?? 0) - (b.seq_index ?? 0) || a.id - b.id));
  const outEdges = new Map(), inEdges = new Map();
  deps.forEach(d => {
    if (!outEdges.has(d.from_id)) outEdges.set(d.from_id, []);
    if (!inEdges.has(d.to_id)) inEdges.set(d.to_id, []);
    outEdges.get(d.from_id).push(d);
    inEdges.get(d.to_id).push(d);
  });
  const stateOf = n => n.kind === "task" ? (n.state || "blocked") : null;
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const projectOf = id => {
    let n = byId.get(id);
    while (n && n.parent_id != null) n = byId.get(n.parent_id);
    return n && n.kind === "project" ? n : null;
  };

  /* goal-level condensation for the DAG view */
  const liftGoal = id => {
    const n = byId.get(id);
    return n.kind === "task" ? n.parent_id : id;
  };
  const liftedMap = new Map();
  deps.forEach(d => {
    const from = liftGoal(d.from_id), to = liftGoal(d.to_id);
    if (from == null || to == null || from === to) return;
    const key = from + ">" + to;
    if (!liftedMap.has(key)) liftedMap.set(key, { from, to, taskLevel: false, origs: [] });
    const e = liftedMap.get(key);
    e.origs.push(d);
    if (byId.get(d.from_id).kind === "task" || byId.get(d.to_id).kind === "task") e.taskLevel = true;
  });
  const lifted = [...liftedMap.values()];
  const lOut = new Map(), lIn = new Map();
  lifted.forEach(e => {
    if (!lOut.has(e.from)) lOut.set(e.from, []);
    if (!lIn.has(e.to)) lIn.set(e.to, []);
    lOut.get(e.from).push(e);
    lIn.get(e.to).push(e);
  });

  /* per-goal link counts: edges touching the goal or any of its tasks */
  const linkCounts = new Map();
  nodes.filter(n => n.kind === "goal").forEach(g => {
    const inner = new Set([(g.id)].concat((kids.get(g.id) || []).map(t => t.id)));
    let cin = 0, cout = 0;
    deps.forEach(d => {
      if (inner.has(d.to_id) && !inner.has(d.from_id)) cin++;
      if (inner.has(d.from_id) && !inner.has(d.to_id)) cout++;
    });
    linkCounts.set(g.id, { cin, cout });
  });

  /* longest-path layering over goals (DAG view) */
  const goals = nodes.filter(n => n.kind === "goal");
  const layerOf = new Map();
  function depth(id, seen) {
    if (layerOf.has(id)) return layerOf.get(id);
    if (seen.has(id)) return 0;
    seen.add(id);
    const preds = (lIn.get(id) || []).map(e => depth(e.from, seen));
    const d = preds.length ? Math.max(...preds) + 1 : 0;
    layerOf.set(id, d);
    return d;
  }
  goals.forEach(g => depth(g.id, new Set()));
  const nLayers = goals.length ? Math.max(...layerOf.values()) + 1 : 0;
  const layers = Array.from({ length: nLayers }, () => []);
  goals.forEach(g => layers[layerOf.get(g.id)].push(g.id));
  layers.forEach(l => l.sort((a, b) => a - b));
  const runPass = (indices, mapNeighbors, key) => {
    const rows = new Map();
    layers.forEach(l => l.forEach((id, i) => rows.set(id, i)));
    for (const li of indices) {
      layers[li].sort((a, b) => {
        const bary = id => {
          const ns = (mapNeighbors.get(id) || []).map(e => rows.get(e[key])).filter(v => v != null);
          return ns.length ? ns.reduce((s, v) => s + v, 0) / ns.length : rows.get(id);
        };
        return bary(a) - bary(b) || a - b;
      });
      layers[li].forEach((id, i) => rows.set(id, i));
    }
  };
  runPass([...layers.keys()].slice(1), lIn, "from");
  runPass([...layers.keys()].slice(0, -1).reverse(), lOut, "to");

  /* ===== DOM refs ===== */
  const forest = document.getElementById("forest");
  const ovsvg = document.getElementById("ovsvg");
  const dag = document.getElementById("dag");
  const dagsvg = document.getElementById("dagsvg");
  const panel = document.getElementById("panel");
  let view = "forest";

  /* ===== build overview (hierarchy tree) ===== */
  const taskLi = t => {
    const st = stateOf(t);
    return `<li class="task ${st}" data-nid="${t.id}" tabindex="0"
      title="${esc(t.name)} - ${st}${t.est_minutes ? ` - ~${t.est_minutes}m` : ""}">
      <i class="dot ${st}"></i><span class="tname">${esc(t.name)}</span>
    </li>`;
  };
  const projects = nodes.filter(n => n.kind === "project").sort((a, b) => a.id - b.id);
  const planner = nodes.filter(n => n.kind === "task" && n.parent_id == null).sort((a, b) => a.id - b.id);
  let fHtml = "";
  for (const p of projects) {
    fHtml += `<section class="proj-block">
      <div class="pcard" title="${esc(p.name)}">
        <span class="sticklab">
          <span class="pname">${esc(p.name)}</span>
          <span class="pmeta">${esc(p.ref || "")}${p.deadline ? " · due " + p.deadline : ""}</span>
        </span>
      </div><div class="ms-row">`;
    for (const m of (kids.get(p.id) || [])) {
      fHtml += `<div class="ms-block">
        <div class="mcard" title="${esc(m.name)}">
          <span class="sticklab">
            <span class="mname">${esc(m.name)}</span>
            ${m.deadline ? `<span class="mmeta">due ${m.deadline}</span>` : ""}
          </span>
        </div><div class="goal-row">`;
      for (const g of (kids.get(m.id) || [])) {
        const tasks = kids.get(g.id) || [];
        const done = tasks.filter(t => t.status === "done").length;
        const lc = linkCounts.get(g.id) || { cin: 0, cout: 0 };
        const linkbits = [];
        if (lc.cin) linkbits.push(`<span class="in">&larr;${lc.cin}</span>`);
        if (lc.cout) linkbits.push(`<span class="out">${lc.cout}&rarr;</span>`);
        fHtml += `<div class="goal-col">
          <div class="gcard" data-nid="${g.id}" tabindex="0" title="${esc(g.name)}">
            <span class="gname">${esc(g.name)}</span>
            <span class="gmeta">
              <span class="dots">${tasks.map(t => `<i class="dot ${stateOf(t)}"></i>`).join("")}</span>
              <span class="count">${done}/${tasks.length}</span>
              ${linkbits.length ? `<span class="links">${linkbits.join(" ")}</span>` : ""}
            </span>
          </div>
          <ul class="tasks">${tasks.map(taskLi).join("")}</ul>
        </div>`;
      }
      fHtml += `</div></div>`;
    }
    fHtml += `</div></section>`;
  }
  if (planner.length) {
    fHtml += `<section class="proj-block">
      <div class="pcard"><span class="sticklab"><span class="pname">Planner</span><span class="pmeta">inbox</span></span></div>
      <div class="ms-row"><div class="ms-block"><div class="mspacer"></div>
      <div class="goal-row"><div class="goal-col">
        <div class="gcard" style="cursor:default"><span class="gname mono" style="font-weight:400;color:var(--muted)">standalone</span>
        <span class="gmeta"><span class="count">${planner.length} tasks</span></span></div>
        <ul class="tasks">${planner.map(taskLi).join("")}</ul>
      </div></div></div></div></section>`;
  }
  forest.insertAdjacentHTML("beforeend", fHtml);

  /* ===== build DAG view ===== */
  let dagHtml = "";
  layers.forEach((layer, li) => {
    dagHtml += `<div class="dcol"><span class="depthlab">depth ${li}</span>`;
    for (const gid of layer) {
      const g = byId.get(gid);
      const proj = projectOf(gid);
      const milestone = g.parent_id != null ? byId.get(g.parent_id) : null;
      const code = (g.ref || "").split(".")[0] || (proj ? proj.name : "");
      const tasks = kids.get(gid) || [];
      const done = tasks.filter(t => t.status === "done").length;
      const hasReady = tasks.some(t => stateOf(t) === "ready");
      dagHtml += `<div class="dcard" data-nid="${gid}" tabindex="0"
        title="${esc(g.name)}${proj ? " - " + esc(proj.name) : ""}${milestone ? " / " + esc(milestone.name) : ""}">
        <div class="crumbs">${esc(code)}${milestone ? " · " + esc(milestone.name) : ""}</div>
        <div class="gname">${esc(g.name)}</div>
        <div class="meta">
          <span class="dots">${tasks.map(t => `<i class="dot ${stateOf(t)}"></i>`).join("")}</span>
          <span class="count">${done}/${tasks.length}</span>
          ${hasReady ? `<span class="nowchip">now</span>` : ""}
        </div>
      </div>`;
    }
    dagHtml += `</div>`;
  });
  dag.insertAdjacentHTML("beforeend", dagHtml);
  const readyCount = nodes.filter(n => stateOf(n) === "ready").length;
  document.getElementById("stats").innerHTML = `
    <span class="chip">${nodes.length} nodes</span>
    <span class="chip">${deps.length} links</span>
    <span class="chip"><i class="dot ready"></i>${readyCount} ready</span>`;

  /* ===== edge drawing ===== */
  function drawDag(focus) {
    const g = dagsvg.querySelector("g");
    g.innerHTML = "";
    const cRect = dag.getBoundingClientRect();
    dagsvg.setAttribute("width", dag.scrollWidth);
    dagsvg.setAttribute("height", dag.scrollHeight);
    const outN = new Map(), inN = new Map(), outI = new Map(), inI = new Map();
    for (const e of lifted) {
      outN.set(e.from, (outN.get(e.from) || 0) + 1);
      inN.set(e.to, (inN.get(e.to) || 0) + 1);
    }
    const sorted = [...lifted].sort((a, b) => a.from - b.from || a.to - b.to);
    for (const e of sorted) {
      const aEl = dag.querySelector(`.dcard[data-nid="${e.from}"]`);
      const bEl = dag.querySelector(`.dcard[data-nid="${e.to}"]`);
      if (!aEl || !bEl) continue;
      const ra = aEl.getBoundingClientRect(), rb = bEl.getBoundingClientRect();
      const oi = (outI.get(e.from) || 0) + 1; outI.set(e.from, oi);
      const ii = (inI.get(e.to) || 0) + 1; inI.set(e.to, ii);
      const ya = ra.top - cRect.top + ra.height * oi / ((outN.get(e.from) || 1) + 1);
      const yb = rb.top - cRect.top + rb.height * ii / ((inN.get(e.to) || 1) + 1);
      const x1 = ra.right - cRect.left, x2 = rb.left - cRect.left;
      const dx = Math.max(30, Math.abs(x2 - x1) * 0.4);
      appendEdge(g, `M ${x1} ${ya} C ${x1 + dx} ${ya}, ${x2 - dx} ${yb}, ${x2} ${yb}`,
        `M ${x2} ${yb} l -7 -3.6 v 7.2 z`, e, focus);
    }
  }
  function appendEdge(g, d, tipD, e, focus) {
    let stroke = "var(--edge)", op = "0.55", w = "1.5";
    if (focus) {
      if (focus.upEdges.has(e)) { stroke = "var(--up)"; op = "1"; w = "2"; }
      else if (focus.downEdges.has(e)) { stroke = "var(--down)"; op = "1"; w = "2"; }
      else { op = "0.1"; }
    }
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", stroke);
    path.setAttribute("stroke-width", w);
    path.setAttribute("opacity", op);
    if (e.taskLevel) path.setAttribute("stroke-dasharray", "5 4");
    g.appendChild(path);
    const tip = document.createElementNS("http://www.w3.org/2000/svg", "path");
    tip.setAttribute("d", tipD);
    tip.setAttribute("fill", stroke);
    tip.setAttribute("opacity", op);
    g.appendChild(tip);
  }
  const ovAnchor = id => forest.querySelector(`[data-nid="${id}"]`);
  function drawOverview(emphasis) {
    const g = ovsvg.querySelector("g");
    g.innerHTML = "";
    const all = document.getElementById("allLinks").checked;
    if (!all && !emphasis) return;
    const cRect = forest.getBoundingClientRect();
    ovsvg.setAttribute("width", forest.scrollWidth);
    ovsvg.setAttribute("height", forest.scrollHeight);
    const hEdges = forestEdges(); // same objects focus/hover chains hold
    let visible = hEdges;
    if (!all) {
      visible = hEdges.filter(
        e => emphasis.upEdges.has(e) || emphasis.downEdges.has(e)
      );
    }
    /* split: goal-to-goal links ride dedicated lanes in the gutter bus;
       task-endpoint links run between the rows themselves */
    const gEdges = [], tEdges = [];
    for (const e of visible) {
      const a = ovAnchor(e.from), b = ovAnchor(e.to);
      if (!a || !b || a === b) continue;
      const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
      const item = { e, ra, rb };
      if (a.classList.contains("gcard") && b.classList.contains("gcard")) gEdges.push(item);
      else tEdges.push(item);
    }
    /* spread multiple connections across each card's width */
    const outN = new Map(), inN = new Map(), outI = new Map(), inI = new Map();
    for (const { e } of gEdges) {
      outN.set(e.from, (outN.get(e.from) || 0) + 1);
      inN.set(e.to, (inN.get(e.to) || 0) + 1);
    }
    /* one lane per link, shortest spans nearest the cards */
    gEdges.forEach(o => {
      o.span = Math.abs(
        (o.ra.left + o.ra.width / 2) - (o.rb.left + o.rb.width / 2)
      );
    });
    gEdges.sort((p, q) => p.span - q.span || p.e.from - q.e.from);
    gEdges.forEach((o, lane) => {
      const { e, ra, rb } = o;
      const oi = (outI.get(e.from) || 0) + 1; outI.set(e.from, oi);
      const ii = (inI.get(e.to) || 0) + 1; inI.set(e.to, ii);
      const x1 = ra.left - cRect.left + ra.width * oi / ((outN.get(e.from) || 1) + 1);
      const x2 = rb.left - cRect.left + rb.width * ii / ((inN.get(e.to) || 1) + 1);
      const y1 = ra.top - cRect.top, y2 = rb.top - cRect.top;
      const laneY = Math.min(y1, y2) - 16 - lane * 7;
      const r = 6, dir = x2 > x1 ? 1 : -1;
      let d;
      if (Math.abs(x2 - x1) < 2 * r + 2) {
        d = `M ${x1} ${y1} C ${x1} ${y1 - 26}, ${x2} ${y2 - 26}, ${x2} ${y2}`;
      } else {
        d = `M ${x1} ${y1} L ${x1} ${laneY + r}`
          + ` Q ${x1} ${laneY} ${x1 + r * dir} ${laneY}`
          + ` L ${x2 - r * dir} ${laneY}`
          + ` Q ${x2} ${laneY} ${x2} ${laneY + r}`
          + ` L ${x2} ${y2}`;
      }
      appendEdge(g, d, `M ${x2} ${y2} l -3.6 -7 h 7.2 z`, e, emphasis);
    });
    for (const { e, ra, rb } of tEdges) {
      const forward = rb.left >= ra.right - 4;
      const x1 = (forward ? ra.right : ra.left) - cRect.left;
      const x2 = (forward ? rb.left : rb.right) - cRect.left;
      const y1 = ra.top + ra.height / 2 - cRect.top;
      const y2 = rb.top + rb.height / 2 - cRect.top;
      const dx = Math.max(24, Math.abs(x2 - x1) * 0.3) * (forward ? 1 : -1);
      appendEdge(g, `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`,
        `M ${x2} ${y2} l ${forward ? -7 : 7} -3.6 v 7.2 z`, e, emphasis);
    }
  }
  function redraw() {
    if (view === "forest") drawOverview(focusState.forest || hoverState);
    else drawDag(focusState.dag);
  }

  /* ===== focus ===== */
  const focusState = { forest: null, dag: null };
  function chain(start, edges, dir) {
    const nbr = new Map();
    edges.forEach(e => {
      const k = dir === "up" ? e.to : e.from;
      if (!nbr.has(k)) nbr.set(k, []);
      nbr.get(k).push(e);
    });
    const seen = new Set([start]), hitEdges = new Set(), queue = [start];
    while (queue.length) {
      const cur = queue.shift();
      for (const e of (nbr.get(cur) || [])) {
        hitEdges.add(e);
        const next = dir === "up" ? e.from : e.to;
        if (!seen.has(next)) { seen.add(next); queue.push(next); }
      }
    }
    seen.delete(start);
    return { ids: seen, edges: hitEdges };
  }
  let forestEdgesCache = null;
  function forestEdges() {
    if (!forestEdgesCache) {
      forestEdgesCache = deps.map(d => ({
        from: d.from_id, to: d.to_id,
        taskLevel: byId.get(d.from_id).kind === "task" || byId.get(d.to_id).kind === "task",
        origs: [d],
      }));
    }
    return forestEdgesCache;
  }
  function clearFocus() {
    focusState.forest = focusState.dag = null;
    document.querySelectorAll(".dimmed").forEach(el => el.classList.remove("dimmed"));
    document.querySelectorAll(".focused, .hit").forEach(el => el.classList.remove("focused", "hit"));
    panel.classList.remove("open");
    redraw();
  }
  function focusNode(nid) {
    const n = byId.get(nid);
    if (!n) return;
    document.querySelectorAll(".focused, .hit").forEach(el => el.classList.remove("focused", "hit"));
    let up, down;
    if (view === "forest") {
      const edges = forestEdges();
      up = chain(nid, edges, "up");
      down = chain(nid, edges, "down");
      focusState.forest = { id: nid, upEdges: up.edges, downEdges: down.edges };
      forest.classList.add("dimmed");
      const mark = (id, cls) => ovAnchor(id)?.classList.add(cls);
      mark(nid, "focused");
      up.ids.forEach(id => mark(id, "hit"));
      down.ids.forEach(id => mark(id, "hit"));
    } else {
      const gid = n.kind === "task" ? (n.parent_id ?? nid) : nid;
      up = chain(gid, lifted, "up");
      down = chain(gid, lifted, "down");
      focusState.dag = { id: gid, upEdges: up.edges, downEdges: down.edges };
      dag.classList.add("dimmed");
      const mark = (id, cls) => dag.querySelector(`.dcard[data-nid="${id}"]`)?.classList.add(cls);
      mark(gid, "focused");
      up.ids.forEach(id => mark(id, "hit"));
      down.ids.forEach(id => mark(id, "hit"));
    }
    redraw();
    renderPanel(n, up.ids, down.ids);
    const focusedEl = document.querySelector(".focused");
    if (focusedEl) focusedEl.scrollIntoView({ block: "nearest", inline: "center" });
  }
  function renderPanel(n, upIds, downIds) {
    const st = stateOf(n);
    const linkli = (id, dir, via) => {
      const t = byId.get(id);
      return `<li><button data-go="${id}">
        <span class="arrow ${dir}">${dir === "up" ? "&larr;" : "&rarr;"}</span>
        <span>${esc(t.name)}${via ? ` <span class="via">via ${esc(via)}</span>` : ""}</span>
      </button></li>`;
    };
    const dIn = (inEdges.get(n.id) || []).map(d => d.from_id);
    const dOut = (outEdges.get(n.id) || []).map(d => d.to_id);
    let taskLinks = "";
    if (n.kind === "goal") {
      const inner = (kids.get(n.id) || []).map(t => t.id);
      const links = deps.filter(d => inner.includes(d.from_id) || inner.includes(d.to_id));
      if (links.length) {
        taskLinks = `<dt>task-level links</dt><dd><ul class="linklist">` + links.map(d => {
          const dir = inner.includes(d.to_id) ? "up" : "down";
          const other = dir === "up" ? d.from_id : d.to_id;
          const mine = dir === "up" ? d.to_id : d.from_id;
          return linkli(other, dir, byId.get(mine).name);
        }).join("") + `</ul></dd>`;
      }
    }
    panel.innerHTML = `
      <button class="close" data-close aria-label="close">&times;</button>
      <div class="kind">${esc(n.kind)}</div>
      <h2>${esc(n.name)}</h2>
      <div class="ref">${esc(n.ref || "")}</div>
      ${st ? `<div class="staterow"><i class="dot ${st}"></i>${st.replace("_", " ")}</div>` : ""}
      <dl>
        ${n.deadline ? `<dt>deadline</dt><dd class="mono">${n.deadline}</dd>` : ""}
        ${n.est_minutes ? `<dt>estimate</dt><dd class="mono">~${n.est_minutes} min</dd>` : ""}
        ${n.tags && n.tags.length ? `<dt>tags</dt><dd>${n.tags.map(t => `<span class="tagchip">${esc(t)}</span>`).join("")}</dd>` : ""}
        ${n.description ? `<dt>note</dt><dd class="note">&ldquo;${esc(n.description)}&rdquo;</dd>` : ""}
        ${dIn.length ? `<dt>waiting on</dt><dd><ul class="linklist">${dIn.map(id => linkli(id, "up")).join("")}</ul></dd>` : ""}
        ${dOut.length ? `<dt>unblocks</dt><dd><ul class="linklist">${dOut.map(id => linkli(id, "down")).join("")}</ul></dd>` : ""}
        ${taskLinks}
        ${(upIds.size || downIds.size) ? `<dt>chain</dt><dd class="chainchips">
          ${upIds.size ? `<span class="chip">&larr; ${upIds.size} upstream</span>` : ""}
          ${downIds.size ? `<span class="chip">${downIds.size} downstream &rarr;</span>` : ""}
        </dd>` : ""}
      </dl>
      <div class="esc">esc to close</div>`;
    panel.classList.add("open");
  }

  /* ===== events ===== */
  function clickHandler(e) {
    const el = e.target.closest("[data-nid]");
    if (!el) { clearFocus(); return; }
    e.stopPropagation();
    const nid = Number(el.dataset.nid);
    const cur = view === "forest" ? focusState.forest : focusState.dag;
    if (cur && cur.id === nid) clearFocus();
    else focusNode(nid);
  }
  forest.addEventListener("click", clickHandler);
  dag.addEventListener("click", clickHandler);
  [forest, dag].forEach(c => c.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
      const el = e.target.closest("[data-nid]");
      if (el) { e.preventDefault(); focusNode(Number(el.dataset.nid)); }
    }
  }));
  panel.addEventListener("click", e => {
    const go = e.target.closest("[data-go]");
    if (go) { focusNode(Number(go.dataset.go)); return; }
    if (e.target.closest("[data-close]")) clearFocus();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") clearFocus(); });

  /* hover previews a node's own links (blue in, orange out) without a click */
  let hoverState = null;
  forest.addEventListener("pointerover", e => {
    if (focusState.forest) return;
    const el = e.target.closest("[data-nid]");
    const nid = el ? Number(el.dataset.nid) : null;
    if ((hoverState && hoverState.id) === nid) return;
    if (nid == null) {
      if (hoverState) { hoverState = null; drawOverview(null); }
      return;
    }
    const edges = forestEdges();
    const upE = new Set(), downE = new Set();
    const mine = new Set([nid]);
    const n = byId.get(nid);
    if (n.kind === "goal") (kids.get(nid) || []).forEach(t => mine.add(t.id));
    edges.forEach(x => {
      if (mine.has(x.to) && !mine.has(x.from)) upE.add(x);
      if (mine.has(x.from) && !mine.has(x.to)) downE.add(x);
    });
    hoverState = { id: nid, upEdges: upE, downEdges: downE };
    drawOverview(hoverState);
  });
  forest.addEventListener("pointerleave", () => {
    if (!focusState.forest && hoverState) { hoverState = null; drawOverview(null); }
  });

  function setView(v) {
    view = v;
    document.getElementById("btnForest").setAttribute("aria-pressed", String(v === "forest"));
    document.getElementById("btnDag").setAttribute("aria-pressed", String(v === "dag"));
    document.getElementById("forestWrap").hidden = v !== "forest";
    document.getElementById("dagWrap").hidden = v !== "dag";
    document.getElementById("allLinksWrap").hidden = v !== "forest";
    clearFocus();
  }
  document.getElementById("btnForest").addEventListener("click", () => setView("forest"));
  document.getElementById("btnDag").addEventListener("click", () => setView("dag"));
  document.getElementById("allLinks").addEventListener("change", redraw);
  window.addEventListener("resize", redraw);

  setView("forest");
</script>

<script>
(() => {
  const zoom = document.getElementById("zoom");
  function applyZoom() {
    const s = Number(zoom.value) / 100;
    for (const id of ["forest", "dag"]) {
      const el = document.getElementById(id);
      el.style.transform = `scale(${s})`;
      el.style.width = `${100 / s}%`;
    }
  }
  zoom.addEventListener("input", applyZoom);
  applyZoom();

  /* bridge to the app: absent in a standalone export, so that stays read-only */
  if (window.parent === window) return;
  document.body.classList.add("live");
  let seq = 0; const pending = new Map();
  const pt = (...args) => new Promise((res, rej) => {
    const id = ++seq; pending.set(id, { res, rej });
    window.parent.postMessage({ ptReq: { id, args } }, "*");
  });
  window.addEventListener("message", (e) => {
    const r = e.data && e.data.ptRes;
    if (!r || !pending.has(r.id)) return;
    const pr = pending.get(r.id); pending.delete(r.id);
    r.error != null ? pr.rej(r.error) : pr.res(r.result);
  });
  const editReq = (id) => window.parent.postMessage({ editReq: id }, "*");

  document.querySelectorAll("li.task").forEach((li) => {
    const id = Number(li.dataset.nid);
    const n = byId.get(id);
    if (n && n.status !== "done" && n.status !== "dropped") {
      const b = document.createElement("button");
      b.className = "tickb"; b.textContent = "\u2713"; b.title = "mark done";
      b.onclick = (ev) => { ev.stopPropagation(); b.disabled = true;
        pt("done", String(id)).catch(() => { b.disabled = false; }); };
      li.appendChild(b);
    }
    const e = document.createElement("button");
    e.className = "editb"; e.textContent = "\u270e"; e.title = "edit";
    e.onclick = (ev) => { ev.stopPropagation(); editReq(id); };
    li.appendChild(e);
  });
  document.querySelectorAll(".gcard[data-nid]").forEach((card) => {
    const e = document.createElement("button");
    e.className = "editb"; e.textContent = "\u270e"; e.title = "edit";
    e.onclick = (ev) => { ev.stopPropagation(); editReq(Number(card.dataset.nid)); };
    card.appendChild(e);
  });

  const btn = document.getElementById("linkMode");
  btn.hidden = false;
  let src = null;
  const disarm = () => {
    btn.classList.remove("armed"); document.body.classList.remove("linking");
    document.querySelectorAll(".linksrc").forEach((el) => el.classList.remove("linksrc"));
    src = null;
  };
  btn.onclick = () => {
    if (btn.classList.contains("armed")) return disarm();
    btn.classList.add("armed"); document.body.classList.add("linking");
  };
  document.addEventListener("click", (ev) => {
    if (!btn.classList.contains("armed")) return;
    const hit = ev.target.closest("li.task, .gcard[data-nid]");
    if (!hit) return;
    ev.stopPropagation(); ev.preventDefault();
    const id = Number(hit.dataset.nid);
    if (src === null) { src = id; hit.classList.add("linksrc"); return; }
    if (id === src) return disarm();
    pt("dep", "add", String(src), String(id)).catch(() => {}).finally(disarm);
  }, true);
})();
</script>
