[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protracker"
version = "0.1.0"
description = "Personal project scheduler - graph core"
requires-python = ">=3.11"

[project.scripts]
pt = "protracker.cli:main"

[tool.setuptools]
packages = ["protracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
